function icon(name,cls=''){return `<svg class="icon ${cls}" viewBox="0 0 24 24" aria-hidden="true">${I[name]||I.file}</svg>`}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function btn(text,action,opts={}){return `<button type="button" class="btn ${opts.cls||''}" data-action="${action}" ${opts.id?`data-id="${esc(opts.id)}"`:''} ${opts.val!==undefined?`data-val="${esc(opts.val)}"`:''} ${opts.disabled?'disabled':''} ${opts.title?`title="${esc(opts.title)}" aria-label="${esc(opts.title)}"`:''}>${opts.icon?icon(opts.icon,opts.small?'sm':''):''}${text?`<span class="${opts.hideMobile?'btn-label':''}">${esc(text)}</span>`:''}</button>`}
function tag(t,c=''){return `<span class="tag ${c}">${esc(t)}</span>`}
function goButton(text,route,cls='',ic=''){return btn(text,'go',{val:route,cls,icon:ic,title:text?'':(route.startsWith('job/')?'공고 상세 보기':route==='calendar'?'일정 화면 보기':'화면 이동')})}
function logo(j,big=false){return `<span class="company-logo ${j.color||''} ${big?'big':''}" aria-hidden="true">${esc(j.mark)}</span>`}
function notice(text,type='',ic='info'){return `<div class="notice ${type}">${icon(ic)}<div>${text}</div></div>`}
function panel(title,content,action=''){return `<section class="panel"><div class="panel-head"><h2>${title}</h2>${action}</div><div class="panel-body" style="padding-top:0">${content}</div></section>`}
function field(label,name,value='',type='text',help='',placeholder=''){return `<div class="field"><label for="${name}">${esc(label)}</label><input id="${name}" name="${name}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}" autocomplete="off">${help?`<span class="field-help">${esc(help)}</span>`:''}</div>`}
function option(v,l,current){return `<option value="${esc(v)}" ${String(v)===String(current)?'selected':''}>${esc(l)}</option>`}
function selectField(label,name,options,current){return `<div class="field"><label for="${name}">${esc(label)}</label><select id="${name}" name="${name}">${options.map(o=>option(o[0],o[1],current)).join('')}</select></div>`}
function textareaField(label,name,value='',help='',rows=4){return `<div class="field"><label for="${name}">${esc(label)}</label><textarea id="${name}" name="${name}" rows="${rows}">${esc(value)}</textarea>${help?`<span class="field-help">${esc(help)}</span>`:''}</div>`}
function pageHead(title,sub='',actions='',eyebrow=''){return `<header class="page-head"><div>${eyebrow?`<p class="eyebrow">${esc(eyebrow)}</p>`:''}<h1>${esc(title)}</h1>${sub?`<p class="subtitle">${sub}</p>`:''}</div>${actions?`<div class="head-actions">${actions}</div>`:''}</header>`}
function empty(title,desc,action='',ic='folder'){return `<div class="empty"><div class="empty-icon">${icon(ic,'lg')}</div><h3>${esc(title)}</h3><p>${desc}</p>${action}</div>`}
function clone(o){return JSON.parse(JSON.stringify(o))}
function uid(prefix){return prefix+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6)}
function dateShort(s){return s?String(s).slice(5).replace('-','.'): '미확인'}
function dateFull(s){return s?String(s).replaceAll('-','.'): '기한 미확인'}
function daysUntil(d){return Math.round((new Date(d+'T12:00:00+09:00')-new Date(TODAY+'T12:00:00+09:00'))/86400000)}
const DRAFT=`여행 일정 서비스 PlanMate를 만들면서, 일정 생성 요청이 오래 걸릴 때 사용자가 같은 요청을 다시 보낼 수 있다는 점을 발견했습니다. 처음에는 응답 속도만 개선하면 된다고 생각했지만, 처리 중인 작업과 실패한 작업을 구분하지 못하면 중복 실행이나 불필요한 재시도가 생길 수 있다고 판단했습니다.\n\n그래서 요청을 받는 과정과 실제 일정을 생성하는 과정을 나누고, 작업의 진행 상태를 확인할 수 있도록 설계를 정리했습니다. AI 도구로 구현을 진행하되, 어떤 상황에서 중복이 발생하는지와 재처리할 때 유지해야 할 조건은 먼저 문서로 정의했습니다. 생성된 코드도 정상 응답 여부만 보는 대신, 같은 요청을 다시 보내거나 처리 도중 실패한 상황에서 상태가 어떻게 남는지 확인하는 방향으로 검토했습니다.\n\n이 과정에서 중요한 것은 특정 기술을 사용했다는 사실보다 그 기술이 필요한 상황과 실패했을 때의 동작을 설명할 수 있어야 한다는 점이었습니다. 아직 대규모 운영 환경에서 검증한 경험은 없기 때문에, 확인한 범위를 넘어 성과를 표현하지 않으려 합니다. 입사 후에도 요구사항과 예외 상황을 먼저 이해하고, 제가 내린 판단을 동료에게 설명할 수 있는 개발자가 되고 싶습니다.`;

function jobTable(jobs,compact=false){if(!jobs.length)return empty('조건에 맞는 예시 공고가 없습니다.','필터를 바꾸거나 검색어를 지워보세요.',btn('필터 초기화','reset-filters',{icon:'refresh',cls:'small'}),'search');return `<div class="table-wrap"><table class="job-table ${compact?'compact':''}"><thead><tr><th style="width:40px"><span class="sr-only">관심 저장</span></th><th>회사 · 직무</th><th>경력 조건</th>${compact?'':'<th>게시일</th>'}<th>마감</th>${compact?'':'<th>출처</th>'}<th style="width:45px"><span class="sr-only">상세 보기</span></th></tr></thead><tbody>${jobs.map(j=>{const d=deadlineInfo(j);return `<tr><td><button class="bookmark ${S.saved.includes(j.id)?'saved':''}" data-action="bookmark" data-id="${j.id}" aria-label="${esc(j.company)} 관심 ${S.saved.includes(j.id)?'해제':'저장'}" aria-pressed="${S.saved.includes(j.id)}">${icon('bookmark','sm')}</button></td><td><div class="row gap-12">${logo(j)}<div><div class="company-label">${esc(j.company)}${j.new?'<span class="accent" style="margin-left:7px;font-size:10px">새로 발견</span>':''}</div><button class="job-title-btn" data-action="go" data-val="job/${j.id}">${esc(j.title)}</button><div class="fine" style="font-size:10px;margin-top:3px">${esc(j.region)} · ${esc(j.domain)}</div></div></div></td><td><span class="nowrap">${esc(j.exp)}</span><div class="fine" style="font-size:10px;margin-top:3px">${esc(j.type)}</div></td>${compact?'':`<td class="muted nowrap">${dateShort(j.posted)}</td>`}<td>${tag(d.label,d.cls)}<div class="fine" style="font-size:10px;margin-top:5px">${j.deadline?dateShort(j.deadline)+(j.time?' '+j.time:' · 시간 미확인'):j.closeType==='rolling'?'개인 목표일로 준비':'원문 확인 필요'}</div></td>${compact?'':`<td><button class="link-btn" data-action="source-job" data-id="${j.id}">원문 ${j.sources}곳 ${icon('external','sm')}</button></td>`}<td>${goButton('','job/'+j.id,'ghost icon-only','chevron')}</td></tr>`}).join('')}</tbody></table></div>`}
function homePage(){const imminent=S.apps.filter(a=>{const j=getJob(a.jobId);return j?.deadline&&daysUntil(j.deadline)>=0&&daysUntil(j.deadline)<=3&&!a.snapshots.length&&a.status!=='closed'}).length;const events=currentEvents().filter(e=>e.date>=TODAY&&e.type!=='deadline').slice(0,3);return `${pageHead('오늘의 준비','새 공고를 확인하고, 진행 중인 지원을 이어가세요.',btn(UI.batchRunning?'확인 중…':'새 공고 확인','run-batch',{icon:UI.batchRunning?'clock':'refresh',disabled:UI.batchRunning}), '2026. 09. 16  /  WED · 예시 기준일')}<section class="stats" aria-label="준비 현황"><div class="stat"><div class="stat-label">새로 발견한 공고 ${icon('search','sm')}</div><div class="stat-number">${S.jobs.filter(j=>j.new).length}<span>건</span></div><div class="stat-desc">내 지원 조건에 맞는 검색 결과</div></div><div class="stat"><div class="stat-label">진행 중인 지원 ${icon('briefcase','sm')}</div><div class="stat-number">${S.apps.filter(a=>a.status!=='closed').length}<span>곳</span></div><div class="stat-desc">준비 중부터 전형 진행까지</div></div><div class="stat"><div class="stat-label">3일 안에 마감 ${icon('clock','sm')}</div><div class="stat-number" style="color:var(--amber)">${imminent}<span>건</span></div><div class="stat-desc">아직 제출하지 않은 지원 기준</div></div><div class="stat"><div class="stat-label">다가오는 전형 ${icon('calendar','sm')}</div><div class="stat-number">${currentEvents().filter(e=>e.type==='stage'&&e.date>=TODAY).length}<span>건</span></div><div class="stat-desc">응시 일정과 면접 준비를 확인</div></div></section>${!S.settings.batchDone?`<div class="mb-16">${notice(`<div class="row between wrap"><span>${S.settings.batchFailed?'최근 갱신을 완료하지 못한 상태입니다.':'오늘 공고 확인이 아직 실행되지 않았습니다.'} 마지막 성공 ${esc(S.settings.lastSuccess)}</span>${btn('갱신 흐름 시연','run-batch',{cls:'small',disabled:UI.batchRunning})}</div>`,'amber','clock')}</div>`:''}${UI.batchRunning?'<div class="loading-line mb-16" role="progressbar" aria-label="모의 배치 진행 중"><span></span></div>':''}<div class="cols-main"><div><section class="panel"><div class="panel-head"><div><h2>먼저 끝내면 좋은 일</h2><p class="fine mt-8">기한과 준비 상태를 기준으로 정리했어요.</p></div>${tag('오늘의 우선순위','outline')}</div><div class="task-row"><span class="task-num">01</span>${logo(getJob('j1'))}<div class="grow"><div class="row gap-6">${tag(getApp('a1').snapshots.length?'제출 완료':'D-3',getApp('a1').snapshots.length?'blue':'amber')}<span class="fine">모노페이</span></div><div class="task-title">${getApp('a1').snapshots.length?'제출한 내용에서 전형 준비를 이어가세요.':'자기소개서의 남은 내용을 확인하세요.'}</div><div class="task-desc">${getApp('a1').snapshots.length?'당시 제출본과 프로필을 보관 중':'문항 '+getApp('a1').questions.filter(q=>q.text).length+'/'+getApp('a1').questions.length+'개 작성 중 · 외부 사이트 제출 전'}</div></div>${goButton(getApp('a1').snapshots.length?'전형 준비':'이어 쓰기',(getApp('a1').snapshots.length?'prep/':'write/')+'a1','small','arrow')}</div><div class="task-row"><span class="task-num">02</span>${logo(getJob('j2'))}<div class="grow"><div class="row gap-6">${tag('내일 회신','blue')}<span class="fine">스택로그</span></div><div class="task-title">면접 가능 시간과 준비 질문을 확인하세요.</div><div class="task-desc">제출본 v1을 기준으로 준비</div></div>${goButton('전형 준비','prep/a2','small','arrow')}</div><div class="task-row"><span class="task-num">03</span>${logo(getJob('j4'))}<div class="grow"><div class="row gap-6">${tag('상시채용','green')}<span class="fine">루프커머스</span></div><div class="task-title">개인 지원 목표일을 점검하세요.</div><div class="task-desc">회사 마감일 없음 · 목표 09.22</div></div>${goButton('준비실','workspace/a4','small','arrow')}</div></section><div class="section-head mt-32"><div><h2>새로 살펴볼 공고</h2><p class="fine mt-8">신입·주니어 / Java·Spring / 서울·경기</p></div>${goButton('전체 보기','jobs','ghost small','arrow')}</div><section class="panel">${jobTable(S.jobs.filter(j=>j.new).slice(0,4),true)}<div class="table-bottom"><span>검색 범위 안에서 발견한 가상의 공고입니다.</span>${tag('예시 데이터')}</div></section></div><aside class="home-right"><section class="panel"><div class="panel-head"><h2>가까운 일정</h2>${goButton('','calendar','ghost icon-only','calendar')}</div>${events.map(e=>`<div class="schedule-row"><div class="date-block"><b>${e.date.slice(8)}</b><span>9월</span></div><div class="schedule-line"><div class="row gap-6">${tag(eventLabel(e.type),e.type==='reply'?'red':e.type==='personal'?'green':'blue')}<span class="fine" style="font-size:10px">${esc(e.time||'시간 미정')}</span></div><button class="schedule-title" style="text-align:left;padding:3px 0" data-action="event-detail" data-id="${e.id}">${esc(e.title)}</button></div></div>`).join('')}<div style="padding:10px 19px 16px">${goButton('일정 전체 보기','calendar','text small','arrow')}</div></section><section class="panel mt-20"><div class="panel-head"><h2>내 경험, 확인된 만큼만</h2></div><div class="panel-body" style="padding-top:0"><p class="fine" style="line-height:1.9">기본 자료와 지원별 수정본을 분리해요.<br>확인되지 않은 성과는 작성 근거로 쓰지 않습니다.</p></div><div class="review-progress"><div class="row between mb-16"><span style="font-size:12px">경험 검토 <strong>${S.experiences.filter(e=>e.confirmed).length}/${S.experiences.length}</strong></span>${goButton('확인하기','experiences','text small')}</div><div class="progress"><span style="width:${100*S.experiences.filter(e=>e.confirmed).length/S.experiences.length}%"></span></div></div></section><div class="mt-20">${notice('시안을 검토하다가 떠오른 수정점은 상단 <strong>의견 남기기</strong>에 적어둘 수 있습니다.','', 'message')}</div></aside></div>`}
function filteredJobs(){let out=S.jobs.filter(j=>UI.jobsTab!=='saved'||S.saved.includes(j.id)).filter(j=>UI.jobsTab!=='new'||j.new);const q=UI.jobsSearch.toLowerCase();if(q)out=out.filter(j=>[j.company,j.title,...j.skills,j.domain].join(' ').toLowerCase().includes(q));if(UI.jobsExp!=='all')out=out.filter(j=>j.exp===UI.jobsExp);if(UI.jobsDeadline!=='all')out=out.filter(j=>UI.jobsDeadline==='ended'?j.deadline&&daysUntil(j.deadline)<0:UI.jobsDeadline==='fixed'?j.closeType==='fixed'&&daysUntil(j.deadline)>=0:j.closeType===UI.jobsDeadline);return out}
function jobsResult(){const jobs=filteredJobs();return `<div class="row between mb-16"><span class="fine"><strong>${jobs.length}</strong>개 공고 ${UI.jobsSearch?`· “${esc(UI.jobsSearch)}” 검색`:''}</span><span class="fine">최신 발견순 · 시안 데이터</span></div><section class="panel">${jobTable(jobs)}<div class="table-bottom"><span>예시 ${jobs.length}건 표시 · 원문은 미리보기로 열립니다.</span><span>1 / 1</span></div></section>`}
function jobsPage(){return `${pageHead('공고 찾기','내 조건으로 좁혀 보고, 자세한 내용은 원문에서 판단하세요.',btn('공고 링크 등록','add-job',{icon:'plus',cls:'primary'}))}<div class="tabs" role="tablist" aria-label="공고 분류">${[['all','전체 공고',S.jobs.length],['new','새로 발견',S.jobs.filter(j=>j.new).length],['saved','관심 공고',S.saved.length]].map(([v,l,n])=>`<button class="tab ${UI.jobsTab===v?'active':''}" role="tab" aria-selected="${UI.jobsTab===v}" data-action="jobs-tab" data-val="${v}">${l}<span class="mini-count">${n}</span></button>`).join('')}</div><div class="row between wrap"><div class="row wrap gap-6"><span class="fine">저장한 조건</span>${tag('신입·주니어')}${tag('Java / Spring')}${tag('서울·경기')}</div>${goButton('조건 수정','data','text small','edit')}</div><div class="filters"><label class="searchbox">${icon('search')}<input id="jobs-search" aria-label="공고 검색" placeholder="회사, 직무, 기술로 검색" value="${esc(UI.jobsSearch)}"></label><select id="jobs-exp" aria-label="경력 조건">${[['all','전체 경력 조건'],['신입','신입'],['신입·주니어','신입·주니어']].map(o=>option(o[0],o[1],UI.jobsExp)).join('')}</select><select id="jobs-deadline" aria-label="마감 유형">${[['all','전체 마감 유형'],['fixed','기간형 · 접수 중'],['rolling','상시채용'],['unknown','기한 미확인'],['ended','접수기간 종료']].map(o=>option(o[0],o[1],UI.jobsDeadline)).join('')}</select>${btn('초기화','reset-filters',{cls:'ghost small',icon:'refresh'})}</div><div id="job-results">${jobsResult()}</div><div class="mt-20">${notice('같은 공고의 여러 출처는 한 건으로 보여줍니다. 날짜에 따른 접수기간 종료와, 원문에서 확인한 실제 마감은 구분합니다.','', 'info')}</div>`}
function jobSources(j){return [{id:j.id+'-official',title:`${j.company} 공식 채용 안내`,kind:'공식 · 예시',tone:'green',year:'2026',summary:'지원 자격과 전형 흐름을 먼저 확인할 자료입니다. 실제 원문이 아닌 화면 검토용 예시입니다.',link:j.manualURL||`https://example.com/jobs/${j.id}`},{id:j.id+'-past',title:'과거 공고와 요구사항 비교',kind:'비교 · 예시',tone:'blue',year:'2025 → 2026',summary:'과거와 현재 자료의 차이를 보여주는 자리입니다. 자료가 없으면 변화를 추정하지 않습니다.',link:`https://example.com/research/${j.id}/history`},{id:j.id+'-review',title:'백엔드 지원 경험에 관한 글',kind:'개인 후기 · 예시',tone:'amber',year:'2025',summary:'작성자의 직무와 응시 시점을 확인해야 합니다. 예전 후기를 현재 전형의 확정 정보로 쓰지 않습니다.',link:`https://example.com/review/${j.id}`}]}
function sourceRows(j){return jobSources(j).map(s=>`<article class="source-row"><div class="row between wrap"><span class="row gap-6">${tag(s.kind,s.tone)}<span class="fine" style="font-size:10px">${s.year}</span></span>${S.researchSaved.includes(s.id)?tag('자료함에 저장됨','green'):''}</div><h3 class="mt-8">${esc(s.title)}</h3><p>${esc(s.summary)}</p><div class="source-actions"><button class="link-btn" data-action="source-preview" data-id="${s.id}">${icon('external','sm')} 원문 링크 미리보기</button><button class="link-btn" data-action="save-research" data-id="${s.id}">${icon(S.researchSaved.includes(s.id)?'check':'plus','sm')} ${S.researchSaved.includes(s.id)?'저장 취소':'자료함에 저장'}</button></div></article>`).join('')}
function jobPage(id){const j=getJob(id);if(!j)return notFound();const d=deadlineInfo(j);const existing=S.apps.find(a=>a.jobId===id);let body='';if(UI.detailTab==='summary')body=`<section class="panel"><div class="panel-head"><h2>이 직무에서 하는 일</h2>${tag('공고 요약 · 예시','outline')}</div><div class="panel-body" style="padding-top:0"><p class="detail-copy">${esc(j.intro)}</p><ul class="detail-list mt-12"><li>${icon('check')}<div>웹 서비스의 API와 데이터 처리 기능을 개발합니다.<p class="fine mt-8">이 항목은 기능 확인을 위한 가상의 직무 설명입니다.</p></div></li><li>${icon('check')}<div>기존 서비스의 업무 흐름과 오류 상황을 분석합니다.</div></li><li>${icon('check')}<div>구현한 기능의 동작과 데이터 정합성을 확인합니다.</div></li></ul><hr><h3>필수와 우대는 다르게 봅니다</h3><div class="row wrap mt-12">${j.skills.map(x=>tag(x)).join('')}</div><p class="fine mt-12">정확한 필수·우대 구분은 실제 원문을 확인해야 합니다. 이 시안에서는 데이터를 읽어오지 않습니다.</p></div></section><section class="panel mt-20"><div class="panel-head"><h2>내 경험과 연결할 부분</h2>${btn('자세히 보기','detail-tab',{val:'fit',cls:'text small',icon:'arrow'})}</div><div class="panel-body" style="padding-top:0"><div class="detail-list"><li>${icon('checkCircle')}<div><strong style="font-size:13px">Spring 서비스와 SQL 흐름 분석</strong><p class="fine mt-8">기존 시스템 분석 경험을 연결하는 예시</p></div></li><li>${icon('checkCircle')}<div><strong style="font-size:13px">작업 상태와 재처리 설계</strong><p class="fine mt-8">PlanMate에서 본인이 판단한 범위를 설명</p></div></li><li>${icon('alert')}<div><strong style="font-size:13px">운영 경험과 성능 수치</strong><p class="fine mt-8">자료만으로 확인되지 않음 · 성과로 자동 작성하지 않음</p></div></li></div></div></section>`;
 if(UI.detailTab==='fit')body=`<section class="panel"><div class="panel-head"><h2>지원 자격과 경험 근거</h2>${tag('합격 확률이 아닙니다','outline')}</div><div class="panel-body" style="padding-top:0">${notice('점수 하나로 판단하지 않습니다. 필수 조건, 경험 근거, 개인 선호를 따로 확인합니다.')}<div class="table-wrap mt-16"><table class="job-table" style="min-width:440px"><thead><tr><th>확인할 항목</th><th>현재 자료</th><th>판단</th></tr></thead><tbody><tr><td>경력 조건</td><td>${esc(j.exp)}</td><td>${tag('사용자 확인 필요','amber')}</td></tr><tr><td>Java / Spring</td><td>실무·프로젝트 설명</td><td>${tag('관련 경험 있음','green')}</td></tr><tr><td>SQL / 데이터 처리</td><td>기존 시스템 분석</td><td>${tag('관련 경험 있음','green')}</td></tr><tr><td>대규모 운영 성과</td><td>확인 가능한 수치 없음</td><td>${tag('근거 부족','amber')}</td></tr><tr><td>근무지역</td><td>${esc(j.region)}</td><td>${tag('선호 조건과 비교')}</td></tr></tbody></table></div><p class="fine mt-16">위 판단은 프로토타입의 설명용 예시이며 실제 자격 판정이 아닙니다.</p>${goButton('내 경험 확인하기','experiences','small mt-16','arrow')}</div></section>`;
 if(UI.detailTab==='research')body=`<section class="panel"><div class="panel-head"><h2>지원 전략을 위한 자료</h2>${tag('요약 → 원문 확인','outline')}</div><div class="panel-body" style="padding-top:0">${sourceRows(j)}<hr><h3>회사에서 확인하고 싶은 질문</h3><p class="detail-copy mt-12">신입 개발자가 처음 맡는 업무는 무엇인가요?\n운영과 신규 개발의 비중은 어떻게 되나요?\n기술 선택과 코드 리뷰는 어떤 방식으로 진행하나요?</p><p class="fine mt-12">답이 없는 항목은 면접에서 회사에 물어볼 질문으로 남깁니다.</p></div></section>`;
 return `${goButton('공고 찾기로','jobs','ghost small mb-16','back')}<header class="page-head"><div class="row start gap-16">${logo(j,true)}<div><div class="row wrap gap-6"><span class="fine">${esc(j.company)}</span>${tag('가상의 회사','outline')}</div><h1 class="mt-8">${esc(j.title)}</h1><p class="subtitle">${esc(j.region)} · ${esc(j.type)} · ${esc(j.domain)}</p></div></div><div class="head-actions"><button class="btn ${S.saved.includes(id)?'outline-accent':''}" data-action="bookmark" data-id="${id}" aria-pressed="${S.saved.includes(id)}">${icon('bookmark')}${S.saved.includes(id)?'관심 저장됨':'관심 저장'}</button>${btn(existing?'지원 준비실 열기':'지원 준비 시작','start-application',{id,cls:'primary',icon:'arrow'})}</div></header><div class="info-grid"><div><small>경력 조건</small><strong>${esc(j.exp)}</strong></div><div><small>공고일</small><strong>${dateFull(j.posted)}</strong></div><div><small>기재된 기한</small><strong>${j.deadline?dateFull(j.deadline)+(j.time?' '+j.time:''):j.closeType==='rolling'?'상시채용':'확인되지 않음'}</strong></div><div><small>정보 기준</small><strong>2026.09.16 · 예시</strong></div></div><div class="tabs" role="tablist" aria-label="공고 상세 분류">${[['summary','공고 요약'],['fit','내 경험 연결'],['research','기업 · 참고 자료']].map(([v,l])=>`<button class="tab ${UI.detailTab===v?'active':''}" role="tab" aria-selected="${UI.detailTab===v}" data-action="detail-tab" data-val="${v}">${l}</button>`).join('')}</div><div class="cols-main"><div>${body}</div><aside><section class="panel deadline-card"><span class="fine">지원 일정을 먼저 확인하세요</span><div class="deadline-number ${d.cls==='amber'?'amber':''}">${esc(d.short)}</div><p style="font-size:12px">${esc(d.detail)}</p><hr><div class="key-value"><span>원문 출처</span><span>${j.sources}곳 · 예시 링크</span></div><div class="key-value"><span>마감 판정</span><span>${j.closeType==='fixed'?'저장된 날짜 기준':'원문 확인 필요'}</span></div>${btn('공고 원문 보기','source-job',{id,cls:'w-full mt-16',icon:'external'})}</section><div class="mt-16">${notice(j.closeType==='rolling'?'상시채용은 마감일을 임의로 만들지 않습니다. 지원 준비실에서 개인 목표일을 정할 수 있어요.':'기재된 날짜만으로 마감 연장이나 조기 종료는 알 수 없습니다. 제출 직전에 원문을 확인하세요.','', 'clock')}</div><section class="panel mt-20"><div class="panel-body"><h3>어디까지 도와주나요?</h3><p class="fine mt-12" style="line-height:1.95">지원할 공고를 선택하면 내 자료를 가져와 자소서와 전형 준비를 이어갑니다. 실제 입사지원은 원래 채용사이트에서 합니다.</p></div></section></aside></div>`}
function appCards(){let apps=S.apps.filter(a=>UI.appFilter==='all'||a.status===UI.appFilter);if(UI.appSearch)apps=apps.filter(a=>{const j=getJob(a.jobId);return (j.company+' '+j.title).toLowerCase().includes(UI.appSearch.toLowerCase())});if(UI.appView==='board')return `<div class="board">${['interest','preparing','submitted','inprocess','closed'].map(s=>`<section class="board-col"><div class="board-head"><span>${appStatus(s)}</span><span>${apps.filter(a=>a.status===s).length}</span></div>${apps.filter(a=>a.status===s).map(a=>{const j=getJob(a.jobId),d=deadlineInfo(j);return `<button class="board-card" data-action="go" data-val="workspace/${a.id}"><div class="row between">${logo(j)}${tag(d.short,d.cls)}</div><h3>${esc(j.company)}</h3><p>${esc(j.title)}</p><div class="row gap-6 mt-12">${tag(a.snapshots.length?'제출본 v'+a.snapshots.length:'초안 작성 중',a.snapshots.length?'blue':'')}</div></button>`}).join('')}${!apps.some(a=>a.status===s)?'<p class="fine" style="font-size:11px;text-align:center;margin-top:30px">아직 등록된 지원이 없어요.</p>':''}</section>`).join('')}</div>`;return `<section class="panel"><div class="table-wrap"><table class="job-table"><thead><tr><th>회사 · 직무</th><th>내 지원 상태</th><th>다음 일정</th><th>작성 · 제출 기록</th><th></th></tr></thead><tbody>${apps.map(a=>{const j=getJob(a.jobId),next=currentEvents().find(e=>e.appId===a.id&&e.date>=TODAY&&e.type!=='deadline'),d=deadlineInfo(j);return `<tr><td><div class="row">${logo(j)}<div><button class="job-title-btn" data-action="go" data-val="workspace/${a.id}">${esc(j.company)}</button><div class="fine" style="font-size:11px;margin-top:4px">${esc(j.title)}</div></div></div></td><td>${tag(appStatus(a.status),appStatusColor(a.status))}</td><td>${next?`<span style="font-size:12px">${dateShort(next.date)} ${esc(next.time)}</span><div class="fine" style="font-size:10px;margin-top:4px">${esc(next.title.split(' · ').slice(1).join(' · '))}</div>`:`${tag(d.label,d.cls)}<div class="fine" style="font-size:10px;margin-top:4px">${j.closeType==='rolling'?'개인 목표일 설정 가능':'공고의 접수기간 기준'}</div>`}</td><td>${a.snapshots.length?`<div class="row gap-6 accent">${icon('lock','sm')}<span>제출본 v${a.snapshots.length}</span></div><div class="fine" style="font-size:10px;margin-top:4px">당시 프로필 보관</div>`:`<span>${a.questions.filter(q=>q.text).length}/${a.questions.length} 문항 작성 중</span><div class="progress mt-8" style="width:95px"><span style="width:${100*a.questions.filter(q=>q.text).length/a.questions.length}%"></span></div>`}</td><td>${goButton('준비실','workspace/'+a.id,'small','arrow')}</td></tr>`}).join('')}</tbody></table></div>${!apps.length?empty('해당 상태의 지원이 없습니다.','다른 상태를 선택하거나 공고에서 지원 준비를 시작하세요.',goButton('공고 찾기','jobs','small')):''}</section>`}
function applicationsPage(){return `${pageHead('지원 관리','어디에 무엇을 제출했는지, 다음에 무엇을 해야 하는지 한눈에 확인하세요.',goButton('새 지원 찾기','jobs','primary','plus'))}<div class="row between wrap mb-16"><div class="segmented" aria-label="지원 관리 보기 방식"><button data-action="app-view" data-val="list" class="${UI.appView==='list'?'active':''}">${icon('list','sm')} 목록</button><button data-action="app-view" data-val="board" class="${UI.appView==='board'?'active':''}">${icon('grid','sm')} 단계별 보드</button></div><span class="fine">지원 이력은 공고가 종료되어도 남아요.</span></div><div class="tabs" role="tablist" aria-label="지원 상태">${[['all','전체'],['interest','관심'],['preparing','준비 중'],['submitted','제출 완료'],['inprocess','전형 진행'],['closed','종료']].map(([v,l])=>`<button class="tab ${UI.appFilter===v?'active':''}" role="tab" aria-selected="${UI.appFilter===v}" data-action="app-filter" data-val="${v}">${l}<span class="mini-count">${v==='all'?S.apps.length:S.apps.filter(a=>a.status===v).length}</span></button>`).join('')}</div><div class="filters"><label class="searchbox" style="max-width:350px">${icon('search')}<input id="app-search" placeholder="지원한 회사나 직무 검색" aria-label="지원한 회사나 직무 검색" value="${esc(UI.appSearch)}"></label></div><div id="application-results">${appCards()}</div>`}
function workHeader(a,active){const j=getJob(a.jobId);const tabs=[['workspace','준비 현황',''],['workspace','조사자료','research'],['write','자기소개서',''],['submission','제출 기록',''],['prep','전형 준비','']];return `<div class="work-header"><div class="row between wrap mb-16">${goButton('지원 관리로','applications','ghost small','back')}<span class="fine">가상의 공고 · 개인 지원 공간</span></div><div class="row between wrap"><div class="work-top">${logo(j,true)}<div><div class="row gap-6 wrap">${tag(appStatus(a.status),appStatusColor(a.status))}<span class="fine">${esc(j.company)}</span></div><h1 class="work-title mt-8">${esc(j.title)}</h1></div></div><div class="row wrap">${btn('공고 원문','source-job',{id:j.id,icon:'external',cls:'small'})}${btn('이 지원의 프로필','app-profile',{id:a.id,icon:'user',cls:'small'})}</div></div><div class="row wrap gap-6 mt-16"><span class="fine">${esc(j.region)}</span><span class="muted">·</span>${tag(deadlineInfo(j).label,deadlineInfo(j).cls)}<span class="fine">${a.snapshots.length?'제출본 v'+a.snapshots.length+' 보관':'기본 프로필에서 가져온 지원별 수정본'}</span></div></div><nav class="tabs" aria-label="이 지원의 준비 메뉴">${tabs.map(([r,l,sub])=>{const key=sub||r;const path=r+'/'+a.id+(sub?'/'+sub:'');return `<button class="tab ${active===key?'active':''}" data-action="go" data-val="${path}" ${active===key?'aria-current="page"':''}>${l}${r==='write'?`<span class="mini-count">${a.questions.length}</span>`:''}</button>`}).join('')}</nav>`}
function checklist(a,items,prefix=''){return items.map(([id,title,desc])=>{const key=prefix+id;return `<div class="check-row ${a.todo[key]?'done':''}"><input type="checkbox" id="todo-${esc(key)}" data-change="todo" data-id="${a.id}" data-key="${esc(key)}" ${a.todo[key]?'checked':''}><label for="todo-${esc(key)}">${esc(title)}${desc?`<div class="fine mt-8" style="font-size:10px;text-decoration:none">${esc(desc)}</div>`:''}</label></div>`}).join('')}
function workspacePage(id,research=false){const a=getApp(id);if(!a)return notFound();const j=getJob(a.jobId);if(research){const savedNotes=S.notes.filter(n=>n.appId===a.id||!n.appId);return `${workHeader(a,'research')}<div class="row between wrap mb-16"><div><h2>이 지원을 위해 모은 자료</h2><p class="fine mt-8">원문 링크, 직접 쓴 메모, 외부 AI 답변을 구분해서 모아요.</p></div>${btn('자료 · 답변 붙여넣기','add-note',{id:a.id,cls:'primary',icon:'plus'})}</div><div class="cols-main"><section class="panel"><div class="panel-body"><div class="row between"><h3>살펴볼 자료</h3>${tag('시점과 출처를 함께 확인','outline')}</div>${sourceRows(j)}${savedNotes.length?`<hr><h3>내가 추가한 자료</h3>${savedNotes.map(n=>noteCard(n)).join('')}`:''}</div></section><aside><section class="panel"><div class="panel-body"><h3>링크를 저장한 다음에는</h3><p class="fine mt-12" style="line-height:1.95">외부에서 읽은 내용이나 다른 AI와 정리한 답변을 붙여 넣을 수 있어요. 저장했다는 이유만으로 사실로 확인된 자료가 되지는 않습니다.</p><hr><div class="row gap-6 wrap">${tag('원문 확인','green')}${tag('내 메모')}${tag('외부 AI · 미확인','amber')}</div></div></section><section class="panel mt-16"><div class="panel-body"><h3>아직 확인하지 못한 정보</h3><p class="fine mt-12" style="line-height:1.95">재무자료의 기간과 연결·별도 기준<br>팀의 실제 업무와 온보딩 방식<br>과거 후기와 현재 전형의 차이</p><p class="fine mt-12">프로토타입은 실제 기업자료를 수집하지 않습니다.</p></div></section></aside></div>`}
 const done=Object.values(a.todo).filter(Boolean).length;return `${workHeader(a,'workspace')}<div class="cols-main"><div><section class="panel"><div class="panel-head"><h2>다음으로 할 일</h2>${tag(done+'개 확인','green')}</div><div class="panel-body" style="padding-top:0">${checklist(a,[['requirements','원문에서 지원 자격과 제출 조건 확인','중복지원 규칙, 필수 파일, 마감 시간도 확인해요.'],['facts','이 지원에 사용할 경험과 사실 검토','기본 자료를 수정해도 다른 지원에는 자동 반영되지 않아요.'],['questions','필수 자기소개서 문항 작성','질문, 최소·최대 분량, 공백 포함 여부를 확인해요.'],['final','외부 사이트에서 최종 제출 내용 확인','복사 버튼을 눌렀다고 제출 완료로 바뀌지 않아요.']])}<div class="row wrap mt-20">${goButton('자기소개서 이어 쓰기','write/'+a.id,'primary','edit')}${goButton('제출 전 확인','submission/'+a.id,'','arrow')}</div></div></section><section class="panel mt-20"><div class="panel-head"><h2>이번 회사의 전형 흐름</h2>${btn('단계 편집','manage-stages',{id:a.id,cls:'text small',icon:'edit'})}</div><div class="panel-body" style="padding-top:0"><p class="fine">회사마다 단계와 순서가 달라요. 받은 안내에 맞춰 수정할 수 있습니다.</p><div class="stage-line">${a.stages.map(st=>`<div class="stage-dot-wrap ${st.state==='진행'?'active':''}">${esc(st.name)}<div style="font-size:9px;margin-top:4px">${st.date?dateShort(st.date):'일정 미정'}</div></div>`).join('')}</div><div class="row between wrap mt-24"><span class="fine">${a.snapshots.length?'실제 제출본을 기준으로 질문을 준비합니다.':'제출 전에는 초안 기반의 연습으로 표시합니다.'}</span>${goButton('전형 준비로','prep/'+a.id,'small','arrow')}</div></div></section><section class="panel mt-20"><div class="panel-head"><h2>지원 기록과 메모</h2>${btn('메모 추가','add-note',{id:a.id,cls:'text small',icon:'plus'})}</div><div class="panel-body" style="padding-top:0">${S.notes.filter(n=>n.appId===a.id).length?S.notes.filter(n=>n.appId===a.id).map(noteCard).join(''):'<p class="fine">아직 이 지원에 남긴 메모가 없어요. 회사에 물어볼 질문이나 안내 내용을 남겨보세요.</p>'}</div></section></div><aside><section class="panel"><div class="panel-body"><div class="row between"><h3>내 지원 상태</h3>${tag('직접 관리','outline')}</div><select class="w-full mt-12" data-change="app-status" data-id="${a.id}" aria-label="내 지원 상태">${[['interest','관심'],['preparing','준비 중'],['submitted','제출 완료'],['inprocess','전형 진행'],['closed','종료']].map(o=>option(o[0],o[1],a.status)).join('')}</select><p class="fine mt-8" style="font-size:10px">실제 지원 취소나 회사의 결과 변경을 대신하지 않습니다.</p><hr><div class="key-value"><span>공고 기한</span><span>${j.deadline?dateShort(j.deadline)+' '+(j.time||'시간 미확인'):j.closeType==='rolling'?'상시채용':'미확인'}</span></div><div class="key-value"><span>개인 목표일</span><span>${a.goal?dateShort(a.goal):'아직 없음'}</span></div>${btn('개인 목표일 설정','goal',{id:a.id,cls:'small w-full mt-12',icon:'calendar'})}</div></section><section class="panel mt-16"><div class="panel-body"><h3>이 지원의 프로필</h3><p class="fine mt-12" style="line-height:1.95">${esc(a.profile.summary.slice(0,115))}${a.profile.summary.length>115?'…':''}</p><div class="row wrap gap-6 mt-12">${a.profile.skills.split(',').slice(0,3).map(x=>tag(x.trim())).join('')}</div>${btn('이번 지원에서만 수정','app-profile',{id:a.id,cls:'text small mt-16',icon:'edit'})}</div></section><div class="mt-16">${notice(a.snapshots.length?'제출본 v'+a.snapshots.length+'은 별도로 보관 중입니다. 초안을 수정해도 제출본은 바뀌지 않습니다.':'지원 완료 후 제출본을 남겨두면, 면접 연락을 받았을 때 당시 내용을 바로 확인할 수 있어요.','', 'lock')}</div></aside></div>`}
function noteCard(n){const tone=n.type==='ai'?'amber':n.type==='source'?'green':'';return `<article class="source-row"><div class="row between wrap">${tag({ai:'외부 AI · 미확인',source:'직접 확인한 자료',memo:'내 메모'}[n.type]||'내 메모',tone)}${btn('','delete-note',{id:n.id,cls:'ghost icon-only',icon:'trash',title:'이 메모 삭제'})}</div><h3 class="mt-8">${esc(n.title)}</h3><p style="white-space:pre-wrap">${esc(n.content)}</p>${n.url?`<button class="link-btn" data-action="note-link" data-id="${n.id}">${icon('link','sm')} 저장한 링크 확인</button>`:''}</article>`}
function writerPage(id){const a=getApp(id);if(!a)return notFound();const q=getQuestion(a);const cnt=countText(q);return `${workHeader(a,'write')}<div class="writer"><aside><p class="fine mb-16">${a.questions.length}개 문항 · 지원별 초안</p><nav class="question-nav" aria-label="자기소개서 문항">${a.questions.map((it,i)=>`<button data-action="select-question" data-id="${it.id}" class="${q.id===it.id?'active':''}" ${q.id===it.id?'aria-current="page"':''}><div class="q-no">QUESTION ${String(i+1).padStart(2,'0')}</div><div class="q-name">${esc(it.title)}</div><div class="q-foot">${it.text?countText(it)+(it.unit==='bytes'?' bytes':'자'):'아직 작성하지 않음'}</div></button>`).join('')}${btn('문항 추가','add-question',{id:a.id,cls:'ghost small w-full',icon:'plus'})}</nav><div class="mt-16">${btn('버전 기록','versions',{id:a.id,cls:'ghost small',icon:'history'})}</div></aside><section><div class="editor-panel"><div class="editor-question"><div class="row between mb-16"><span class="eyebrow" style="margin:0">QUESTION ${String(a.questions.indexOf(q)+1).padStart(2,'0')}</span>${btn('문항 수정','edit-question',{id:a.id,cls:'ghost small',icon:'edit'})}</div><h2>${esc(q.prompt)}</h2><div class="row wrap gap-6 mt-12">${tag(`${q.min}–${q.max}${q.unit==='bytes'?' bytes':'자'}`,'outline')}${tag(q.spaces?'공백 포함':'공백 제외','outline')}${a.snapshots.length?tag('제출본과 별도의 작업본','blue'):tag('초안','green')}</div></div><div class="editor-toolbar"><span class="row gap-6">${icon('edit','sm')} 자유롭게 수정한 뒤 적용할 수 있어요.</span><span class="row gap-6" id="save-state">${icon('check','sm')} 브라우저 저장</span></div><label class="sr-only" for="draft-editor">자기소개서 답변</label><textarea id="draft-editor" class="editor-area" data-app="${a.id}" data-q="${q.id}" spellcheck="false" placeholder="직접 작성하거나 ‘예시 초안 생성’으로 검토 흐름을 확인해 보세요.">${esc(q.text)}</textarea><div class="editor-bottom"><span class="muted">${icon('lock','sm')} 실제 제출 전 작업본</span><div class="row gap-6"><strong id="char-count" class="char-count ${cnt>=q.min&&cnt<=q.max?'good':'bad'}">${cnt}</strong><span>/ ${q.max}${q.unit==='bytes'?' bytes':'자'}</span><span id="char-status" class="tag ${cnt>=q.min&&cnt<=q.max?'green':'amber'}">${cnt<q.min?'최소 분량 미달':cnt>q.max?'최대 분량 초과':'분량 충족'}</span></div></div></div><div class="editor-actionbar">${btn(UI.generating?'예시 생성 중…':'예시 초안 생성','generate',{id:a.id,cls:'primary',icon:'spark',disabled:UI.generating})}${btn('관점별 검토','review-draft',{id:a.id,icon:'checkCircle'})}${btn('답변 복사','copy-draft',{id:a.id,cls:'ghost',icon:'copy'})}<span class="fine grow right" style="font-size:10px">생성 결과는 비교 후 적용됩니다.</span></div><p class="fine mt-12" style="font-size:10px">이 버튼은 미리 작성한 예시 답변을 불러옵니다. 실제 모델 호출·전송·과금은 없습니다.</p></section><aside class="writer-aside"><section class="sidebox"><div class="row between"><h3 style="margin:0">이번 문항에 사용할 경험</h3>${btn('','app-profile',{id:a.id,cls:'ghost icon-only',icon:'edit',title:'이 지원의 경험 수정'})}</div>${S.experiences.slice(0,2).map((e,i)=>`<label class="evidence-row"><input type="checkbox" data-change="evidence" data-id="${a.id}" data-key="${e.id}" ${a.evidence?.[e.id]===false?'':'checked'}><span><strong>${esc(i===0?'PlanMate':'기존 시스템 분석')}</strong><p>${esc(e.role)}</p><span class="tag green" style="font-size:9px;margin-top:7px">사용자 확인 상태 · 예시</span></span></label>`).join('')}<p class="fine" style="font-size:10px;margin-top:9px">선택 상태만 저장하는 시연입니다. 예시 생성문은 자동 개인화되지 않습니다.</p></section><section class="sidebox"><div class="row gap-6 amber"><span>${icon('alert','sm')}</span><h3 style="margin:0;color:var(--amber)">확인할 사실</h3></div><p class="fine mt-12" style="line-height:1.9">대규모 운영 트래픽과 성능 개선 수치는 확인되지 않았어요. 실제로 검증한 범위만 작성해 주세요.</p><hr><h3>문체 원칙</h3><p class="fine" style="line-height:1.95">과장된 성과를 만들지 않기<br>기술 나열보다 판단과 근거 쓰기<br>내가 설명할 수 있는 표현 사용</p></section></aside></div>`}
function submissionPage(id){const a=getApp(id);if(!a)return notFound();const snap=a.snapshots[a.snapshots.length-1];if(!snap)return `${workHeader(a,'submission')}<div class="cols-main"><section class="panel"><div class="panel-head"><h2>제출하기 전, 마지막 확인</h2>${tag('외부 사이트에서 직접 지원','outline')}</div><div class="panel-body" style="padding-top:0">${checklist(a,[['all','필수 문항이 빠지지 않았는지 확인했습니다.','작성 완료와 실제 제출 완료는 다릅니다.'],['files','필요한 파일과 링크를 확인했습니다.','포트폴리오 링크 접근과 제출 형식을 확인해요.'],['names','다른 회사 이름이나 과장된 성과가 없습니다.','확인된 경험과 수행 범위를 기준으로 점검해요.'],['actual','외부 채용사이트에서 제출할 내용을 확인했습니다.','이 체크는 실제 사이트에 제출하는 동작이 아닙니다.']],'submit-')}<hr><h3>기록에 함께 남길 내용</h3><div class="row wrap gap-6 mt-12">${tag('현재 자소서 '+a.questions.length+'문항')}${tag('이 지원의 프로필')}${tag('포트폴리오 버전명')}</div><p class="fine mt-16">실제 제출을 마친 후, 최종 내용과 같은지 확인하고 제출 기록을 만드세요. 이후 초안을 수정해도 당시 기록은 유지됩니다.</p>${btn('제출 기록 만들기','confirm-submit',{id:a.id,cls:'primary mt-20',icon:'lock'})}</div></section><aside>${notice('프로토타입에서는 예시 스냅샷만 만듭니다. 입사지원이나 문서 업로드를 대신하지 않습니다.','blue','info')}<section class="panel mt-16"><div class="panel-body"><h3>작성 상태</h3>${a.questions.map(q=>`<div class="key-value"><span>${esc(q.title)}</span><span>${tag(q.text?'작성 중':'미작성',q.text?'':'amber')}</span></div>`).join('')}${goButton('작성 화면으로','write/'+a.id,'w-full small mt-12','edit')}</div></section></aside></div>`;
 return `${workHeader(a,'submission')}<div class="row between wrap mb-16"><div><h2>제출본 v${snap.version}</h2><p class="fine mt-8">${dateFull(snap.date)} 기록 · 당시 자료가 고정된 예시 스냅샷</p></div><div class="row wrap">${btn('이전 제출본','snapshots',{id:a.id,icon:'history',cls:'small'})}${btn('새 제출본 기록','confirm-submit',{id:a.id,icon:'plus',cls:'small'})}</div></div>${notice('현재 작업본이나 기본 프로필을 바꿔도 아래 제출본은 바뀌지 않습니다. 외부 사이트에서의 제출·수정·철회는 별도로 진행해야 합니다.','green','lock')}<div class="cols-main mt-20"><div>${snap.questions.map((q,i)=>`<section class="panel ${i?'mt-20':''}"><div class="panel-head"><div><div class="fine" style="font-size:10px">QUESTION ${String(i+1).padStart(2,'0')}</div><h3 class="mt-8">${esc(q.title)}</h3></div>${tag(countText(q)+(q.unit==='bytes'?' bytes':'자'),'outline')}</div><div class="panel-body" style="padding-top:0"><p class="fine mb-16">${esc(q.prompt)}</p><div class="snapshot-text">${esc(q.text||'제출 당시 내용 없음')}</div></div></section>`).join('')}</div><aside><section class="panel"><div class="panel-body"><h3>함께 보관된 프로필</h3><p class="fine mt-12" style="line-height:1.95">${esc(snap.profile.summary)}</p><div class="row wrap gap-6 mt-12">${snap.profile.skills.split(',').slice(0,4).map(x=>tag(x.trim())).join('')}</div><hr><div class="row gap-6">${icon('file','sm')}<span class="fine">${esc(snap.file)}</span></div><p class="fine mt-8" style="font-size:10px">파일명만 있는 시연입니다. 실제 파일 내용은 저장하지 않습니다.</p></div></section><section class="panel mt-16"><div class="panel-body"><h3>이제 전형 준비로</h3><p class="fine mt-12" style="line-height:1.9">내가 제출한 주장과 경험에서 이어질 질문을 준비해 보세요.</p>${goButton('제출본으로 전형 준비','prep/'+a.id,'primary w-full mt-16','arrow')}</div></section></aside></div>`}
function stageQuestions(a,st){a.stageQA=a.stageQA||{};if(!a.stageQA[st.id]){if(st.type==='coding')a.stageQA[st.id]=[{id:'cq1',title:'응시 가능한 언어와 시험 시간을 확인했나요?',origin:'개별 응시 안내 · 실제 회사 조건은 원문 확인',follow:'허용 언어 버전, 외부 자료와 AI 사용 허용 여부도 확인하세요.',study:'응시 안내 확인',answer:'',level:'미확인'},{id:'cq2',title:'배열과 해시를 활용하는 문제의 접근 과정을 설명할 수 있나요?',origin:'공통 연습 항목 · 실제 출제를 예측하지 않음',follow:'입력 크기가 커지면 시간과 공간 사용은 어떻게 달라질까요?',study:'배열 · 해시 · 시간복잡도',answer:'',level:'미확인'},{id:'cq3',title:'틀린 문제에서 놓친 조건과 경계값은 무엇이었나요?',origin:'연습 후 회고 · 사용자가 기록한 내용을 재사용',follow:'같은 실수를 줄이기 위한 확인 순서를 정리해 보세요.',study:'경계값 · 디버깅 · 회고',answer:'',level:'미확인'}];else if(st.type==='task')a.stageQA[st.id]=[{id:'tq1',title:'요구사항과 제출 범위를 본인의 말로 설명할 수 있나요?',origin:'과제 안내 · 실제 입력한 문서가 기준',follow:'필수와 선택 항목을 어떻게 나눴나요? 아직 확인할 조건은 무엇인가요?',study:'요구사항 · 범위',answer:'',level:'미확인'},{id:'tq2',title:'기술 선택과 포기한 대안의 이유는 무엇인가요?',origin:'과제 리뷰 준비 · 설명용 예시',follow:'다른 방법의 장점은 무엇이며 이번 범위에서는 왜 선택하지 않았나요?',study:'설계 판단 · 트레이드오프',answer:'',level:'미확인'}];else a.stageQA[st.id]=clone(a.qa.length?a.qa:SAMPLE_QA)}return a.stageQA[st.id]}
function prepPage(id){const a=getApp(id);if(!a)return notFound();const st=a.stages.find(x=>x.id===a.activeStage)||a.stages[0];if(!st)return `${workHeader(a,'prep')}${empty('전형 단계를 먼저 추가해 주세요.','회사에서 안내받은 순서와 일정을 등록해 보세요.',btn('단계 추가','manage-stages',{id:a.id,cls:'primary',icon:'plus'}))}`;const qa=stageQuestions(a,st);let content='';if(UI.prepTab==='questions')content=`<div class="row between wrap mb-16"><p class="fine">실제 질문 예측이 아니라, 설명할 수 있는지 점검하는 예시입니다.</p>${btn('질문 생성 시연','generate-questions',{id:a.id,cls:'small',icon:'spark'})}</div>${qa.map((q,i)=>`<article class="qa-item"><div class="qa-head"><button class="qa-toggle" data-action="qa-toggle" data-id="${q.id}" aria-expanded="${UI.openQA===q.id}"><span class="qa-no">${String(i+1).padStart(2,'0')}</span><div class="grow"><div class="qa-title">${esc(q.title)}</div><p class="qa-origin">${esc(q.origin)}</p></div>${icon(UI.openQA===q.id?'up':'down','sm')}</button>${tag(q.level,q.level==='꼬리질문 점검'?'green':q.level==='미확인'?'':'blue')}</div>${UI.openQA===q.id?`<div class="qa-content"><div class="meta-box"><span class="fine" style="color:var(--accent)">이어질 수 있는 질문</span><p class="mt-8">${esc(q.follow)}</p></div><label class="fine" style="display:block;margin:14px 0 7px" for="answer-${q.id}">내 말로 정리한 답변</label><textarea id="answer-${q.id}" data-answer="${q.id}" data-app="${a.id}" placeholder="내가 판단하고 검증한 내용을 중심으로 적어보세요.">${esc(q.answer)}</textarea><div class="row between wrap mt-12"><button class="link-btn" data-action="study" data-id="${q.id}">${icon('book','sm')} ${esc(q.study)}</button><label class="row gap-6"><span class="fine">준비 상태</span><select data-change="qa-level" data-id="${q.id}" data-app="${a.id}" aria-label="${esc(q.title)} 준비 상태">${['미확인','답변 작성','직접 설명','꼬리질문 점검'].map(v=>option(v,v,q.level)).join('')}</select></label></div></div>`:''}</article>`).join('')}`;
if(UI.prepTab==='study')content=`<div class="panel"><div class="panel-body"><h2>설명이 막힌 부분을 공부로 연결</h2><p class="fine mt-12">다른 지원에서 같은 개념을 공부했다면 기록을 재사용합니다. 이 화면은 학습 연결 흐름을 보여주는 예시입니다.</p>${qa.map(q=>`<div class="source-row"><div class="row between wrap"><div><h3>${esc(q.study)}</h3><p>${esc(q.title)}</p></div>${btn('학습 메모','study',{id:q.id,cls:'small',icon:'book'})}</div></div>`).join('')}</div></div>`;
if(UI.prepTab==='checklist')content=`<div class="cols-half"><section class="panel"><div class="panel-body"><h3>내용 준비</h3><div class="mt-12">${checklist(a,[['source','전형 안내와 제출본 확인','과거 후기와 이번 안내를 구분합니다.'],['answer','설계와 경험을 직접 설명해 보기','AI가 만든 답변을 읽은 것과 구분합니다.'],['question','회사에 물어볼 질문 준비','실제 업무, 온보딩, 피드백 방식 등을 정리합니다.']],st.id+'-content-')}</div></div></section><section class="panel"><div class="panel-body"><h3>실행 준비</h3><div class="mt-12">${checklist(a,[['reply','회신 기한과 접속 링크 확인','시험일과 회신 마감은 다른 일정입니다.'],['env',st.type==='coding'?'허용 언어와 응시 환경 점검':'카메라·마이크 또는 방문 장소 확인','실제 전형 플랫폼의 안내를 확인합니다.'],['rule','참고자료·AI 사용 허용 범위 확인','확인되지 않은 허용 조건은 추정하지 않습니다.']],st.id+'-exec-')}</div></div></section></div>`;
if(UI.prepTab==='review')content=`<section class="panel"><div class="panel-body"><h2>전형 후에 남기는 짧은 기록</h2><p class="fine mt-8">받은 피드백, 본인의 회고, 추정을 구분해 다음 준비에 사용해요.</p><div class="mt-20">${textareaField('실제로 받은 질문과 다시 준비할 부분','prep-review',a.review,'불합격 이유를 추정해 사실로 기록하지 않습니다.',8)}</div>${btn('회고 저장','save-review',{id:a.id,cls:'primary',icon:'check'})}</div></section>`;
return `${workHeader(a,'prep')}<div class="mb-16">${notice(a.snapshots.length?`<strong>제출본 v${a.snapshots.length}</strong>을 기준으로 하는 준비 화면입니다. 아래 질문은 미리 작성된 예시이며 실제 AI 분석 결과가 아닙니다.`:'아직 제출본이 없습니다. <strong>현재 초안을 참고한 연습</strong>으로 표시합니다. 제출 기록을 만든 뒤 당시 내용과 연결하세요.',a.snapshots.length?'green':'amber','lock')}</div><div class="prep-layout"><aside><div class="row between mb-16"><h3>이번 채용 절차</h3>${btn('','manage-stages',{id:a.id,cls:'ghost icon-only',icon:'edit',title:'전형 단계 편집'})}</div><nav class="timeline-steps" aria-label="전형 단계">${a.stages.map((x,i)=>`<button class="stage-btn ${st.id===x.id?'active':''}" data-action="select-stage" data-id="${x.id}" data-val="${a.id}"><span class="stage-circle">${x.state==='완료'?icon('check','sm'):i+1}</span><div><h3>${esc(x.name)}</h3><p>${x.date?dateShort(x.date)+' '+esc(x.time||''): '일정 미정'} · ${esc(x.state)}</p></div></button>`).join('')}${btn('단계 추가','manage-stages',{id:a.id,cls:'ghost small w-full',icon:'plus'})}</nav><div class="mt-16">${btn('안내 붙여넣기','paste-invitation',{id:a.id,cls:'small w-full',icon:'message'})}</div></aside><section><div class="row between wrap mb-16"><div><h2 style="font-size:21px">${esc(st.name)} 준비</h2><p class="fine mt-8">${st.date?dateFull(st.date)+' '+esc(st.time||'시간 미정'):'아직 안내된 일정이 없습니다.'}</p></div><div class="row gap-6">${tag(stageLabel(st.type),'blue')}<select data-change="stage-status" data-id="${st.id}" data-app="${a.id}" aria-label="현재 전형 상태" style="font-size:12px;padding:7px 9px">${['대기','진행','완료'].map(v=>option(v,v,st.state)).join('')}</select></div></div><div class="prep-subtabs">${[['questions','질문 · 답변'],['study','학습 연결'],['checklist','준비 체크리스트'],['review','전형 회고']].map(([v,l])=>btn(l,'prep-tab',{val:v,cls:UI.prepTab===v?'outline-accent small':'ghost small'})).join('')}</div>${content}</section></div>`}
function dataPage(){const p=S.profile;let body='';if(UI.profileTab==='profile')body=`<div class="cols-main"><section class="panel"><div class="panel-head"><h2>기본 프로필</h2>${tag('새 지원의 출발점','green')}</div><div class="panel-body" style="padding-top:0"><div class="form-grid">${field('표시 이름','profile-name',p.name)}${field('지원 직무','profile-role',p.role)}<div class="span2">${textareaField('나를 설명하는 경험 요약','profile-summary',p.summary,'실제 민감한 개인정보는 입력하지 마세요. 프로토타입 데이터는 브라우저에 저장됩니다.',5)}</div><div class="span2">${field('사용 기술','profile-skills',p.skills,'text','쉼표로 구분합니다.')}</div>${field('포트폴리오 링크','profile-portfolio',p.portfolio,'url')}${field('GitHub 링크','profile-github',p.github,'url')}<div class="span2">${field('기술 블로그 링크','profile-blog',p.blog,'url')}</div></div><hr><h3>공고 검색 조건</h3><div class="form-grid mt-16">${selectField('경력 조건','profile-career',[['신입','신입'],['신입·주니어','신입·주니어']],p.career)}${field('희망 지역','profile-region',p.region)}<div class="span2">${field('제외하거나 확인할 조건','profile-exclusions',p.exclusions)}</div></div><div class="row wrap mt-20">${btn('기본 프로필 저장','save-profile',{cls:'primary',icon:'check'})}<span class="fine">기존 지원별 프로필은 자동으로 바뀌지 않아요.</span></div></div></section><aside><section class="panel"><div class="panel-body"><h3>자료는 세 층으로 나눕니다</h3><div class="source-row"><strong style="font-size:12px">01 기본 프로필</strong><p>새로운 지원을 준비할 때 재사용합니다.</p></div><div class="source-row"><strong style="font-size:12px">02 지원별 작업본</strong><p>회사마다 강조할 경험을 다르게 수정합니다.</p></div><div class="source-row"><strong style="font-size:12px">03 제출 확정본</strong><p>제출 당시의 내용을 별도로 보관합니다.</p></div></div></section><div class="mt-16">${notice('프로필의 경험 문장은 설명용 예시입니다. 코드나 링크가 있다고 실제 수행 경험으로 확정하지 않습니다.','', 'info')}</div></aside></div>`;
 if(UI.profileTab==='sources')body=`<div class="row between wrap mb-16"><p class="fine">원본 자료와 읽기 상태를 따로 관리합니다.</p>${btn('자료 등록','add-source',{cls:'primary',icon:'plus'})}</div><div class="cols-main"><section class="panel"><div class="panel-body" style="padding-top:4px">${S.sources.map(s=>`<article class="source-file"><span class="file-icon">${icon(s.type==='file'||s.type==='portfolio'?'file':'link')}</span><div class="grow"><div class="row between wrap"><h3 style="font-size:13px">${esc(s.title)}</h3>${tag(s.status,s.status.includes('링크')?'':'blue')}</div><p class="fine mt-8" style="line-height:1.9">${esc(s.note)}</p>${s.url?`<p class="fine mt-8" style="font-size:10px;overflow-wrap:anywhere">${esc(s.url)}</p>`:''}<div class="row mt-12">${btn('등록 내용','source-info',{id:s.id,cls:'text small',icon:'eye'})}${btn('삭제','delete-source',{id:s.id,cls:'ghost small',icon:'trash'})}</div></div></article>`).join('')}</div></section><aside>${notice('파일을 선택해도 이 시안은 <strong>파일명만 저장</strong>합니다. 내용 업로드, OCR, 저장소 분석은 수행하지 않습니다.','blue','info')}<section class="panel mt-16"><div class="panel-body"><h3>읽은 자료와 링크는 다릅니다</h3><p class="fine mt-12" style="line-height:1.95">링크 등록만으로 AI가 원문을 읽었다고 표시하지 않습니다. 실제 분석 결과에서 확인할 경험은 별도로 검토합니다.</p>${goButton('경험 검토 화면','experiences','small mt-16','arrow')}</div></section></aside></div>`;
 if(UI.profileTab==='notes')body=`<div class="row between wrap mb-16"><p class="fine">개인 메모와 외부 AI 답변을 지원 건에 연결합니다.</p>${btn('메모 · 답변 추가','add-note',{cls:'primary',icon:'plus'})}</div>${S.notes.length?`<section class="panel"><div class="panel-body">${S.notes.map(noteCard).join('')}</div></section>`: `<section class="panel">${empty('외부에서 정리한 답변도 모아두세요.','다른 AI의 답변, 블로그를 읽고 쓴 메모, 면접에서 확인하고 싶은 질문을 저장할 수 있습니다.',btn('첫 자료 붙여넣기','add-note',{cls:'primary',icon:'plus'}),'message')}</section>`}`;

function dateISO(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function calendarGrid(){const y=UI.calendarYear,m=UI.calendarMonth,start=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),prevDays=new Date(y,m,0).getDate(),count=Math.ceil((start+days)/7)*7;const events=currentEvents().filter(e=>UI.calFilter==='all'||e.type===UI.calFilter);let html='';for(let i=0;i<count;i++){let day=i-start+1,other=false,yy=y,mm=m;if(day<1){day=prevDays+day;mm=m-1;other=true}else if(day>days){day-=days;mm=m+1;other=true}if(mm<0){yy--;mm=11}if(mm>11){yy++;mm=0}const date=dateISO(yy,mm,day);const es=events.filter(e=>e.date===date);html+=`<div class="cal-day ${other?'other':''} ${UI.selectedDate===date?'selected':''}"><button class="cal-date ${date===TODAY?'today':''}" data-action="select-date" data-val="${date}" aria-label="${date} 일정 보기" ${date===TODAY?'aria-current="date"':''}>${day}</button>${es.slice(0,3).map(e=>`<button class="cal-event ${e.type}" data-action="event-detail" data-id="${e.id}" title="${esc(e.title)}">${esc(e.title)}</button>`).join('')}${es.length>3?`<button class="fine" style="font-size:9px" data-action="select-date" data-val="${date}">+${es.length-3}개</button>`:''}</div>`}return html}
function selectedDateEvents(){const es=currentEvents().filter(e=>e.date===UI.selectedDate&&(UI.calFilter==='all'||e.type===UI.calFilter));return `<section class="panel"><div class="panel-head"><h2>${dateShort(UI.selectedDate)} 일정</h2>${btn('','add-event',{val:UI.selectedDate,cls:'ghost icon-only',icon:'plus',title:'선택한 날짜에 일정 추가'})}</div><div class="panel-body" style="padding-top:0">${es.length?es.map(e=>`<article class="day-event">${tag(eventLabel(e.type),e.type==='deadline'?'amber':e.type==='personal'?'green':'blue')}<h3>${esc(e.title)}</h3><p class="fine">${esc(e.time||'시간 미정')}</p>${btn('일정 확인','event-detail',{id:e.id,cls:'text small mt-8',icon:'arrow'})}</article>`).join(''):'<p class="fine" style="padding:10px 0 20px">등록된 일정이 없습니다.</p>'}</div></section>`}

function slackMessage(){const due=S.apps.filter(a=>a.status!=='closed'&&!a.snapshots.length&&getJob(a.jobId).deadline&&daysUntil(getJob(a.jobId).deadline)>=0&&daysUntil(getJob(a.jobId).deadline)<=3);return `<div class="slack-preview"><span class="bot">준</span><div class="grow slack-msg"><div class="row wrap gap-6"><strong>준비실</strong>${tag('앱')}<span class="fine" style="font-size:10px">00:08 · 발송 예시</span></div><p class="mt-8"><strong>오늘의 지원 준비 요약</strong></p><blockquote>새로 발견한 맞춤 공고 <strong>${S.jobs.filter(j=>j.new).length}건</strong><br>3일 안에 마감되는 미제출 지원 <strong>${due.length}건</strong><br>다가오는 회신·전형 일정을 확인하세요.</blockquote><div class="mt-12">${goButton('준비실에서 확인','home','small')}</div><p class="fine mt-12" style="font-size:10px">#job-alerts · 실제 메시지는 전송되지 않습니다.</p></div></div>`}
function authPage(signup=false){return `<div class="auth-wrap"><section class="auth-story"><div class="small-brand"><span class="brandmark"><i></i><i></i><i></i><i></i></span><strong>준비실</strong><span class="fine">가칭</span></div><div><p class="eyebrow">ONE PLACE, YOUR NEXT STEP</p><h1>찾아본 정보가<br>다음 준비로<br>이어지도록.</h1><div class="story-line"></div><div class="column" style="gap:17px"><div class="row gap-16"><span class="fine">01</span><span>내 조건에 맞는 공고를 한눈에</span></div><div class="row gap-16"><span class="fine">02</span><span>내 경험으로 쓰는 지원서</span></div><div class="row gap-16"><span class="fine">03</span><span>제출본에서 이어지는 전형 준비</span></div></div></div><p class="fine" style="font-size:11px">다크모드 클릭형 프로토타입 · 실제 인증 없음</p></section><div class="auth-form-wrap"><section class="auth-form"><p class="eyebrow">${signup?'YOUR WORKSPACE':'WELCOME BACK'}</p><h1>${signup?'나의 준비 공간 만들기':'준비하던 곳에서 다시 시작'}</h1><p class="subtitle">${signup?'일반 회원가입 화면의 검토용 시연입니다.':'실제 계정 없이 화면을 확인할 수 있어요.'}</p><div class="mt-24">${field('아이디','auth-id','','text','','예시 아이디를 입력하거나 비워두세요')}${signup?field('표시 이름','auth-name','','text','','예: 지원자'):''}${field('비밀번호','auth-password','','password','실제 비밀번호를 입력하지 마세요. 입력값은 저장하지 않습니다.','입력 없이 체험할 수 있습니다.')}</div>${btn(signup?'예시 계정으로 최초 설정':'예시 계정으로 시작',signup?'demo-signup':'demo-login',{cls:'primary w-full mt-24',icon:'arrow'})}<div class="row between mt-16"><span class="fine">${signup?'이미 계정이 있나요?':'처음 이용하나요?'}</span>${goButton(signup?'로그인 화면':'회원가입 화면',signup?'login':'signup','text small')}</div><div class="auth-foot">이 시안에는 회원가입, 인증, 비밀번호 저장이 구현되어 있지 않습니다. OAuth와 이메일 인증이 없는 화면 흐름을 검토합니다.</div><div class="mt-20">${goButton('로그인 없이 전체 화면 보기','home','ghost small','eye')}</div></section></div></div><div class="auth-skip row gap-6"><span class="prototype-label">시안 · 인증 없음</span>${btn('화면 목록','screen-map',{cls:'small',icon:'grid'})}</div>`}
function onboardingPage(){const n=S.onboardStep||1;let content='';if(n===1)content=`<h2>먼저, 어떤 공고를 찾을까요?</h2><p class="fine mt-8">필수 조건과 선호 조건을 구분하는 첫 설정입니다.</p><div class="form-grid mt-24">${selectField('지원 경력','on-career',[['신입','신입'],['신입·주니어','신입·주니어']],S.profile.career)}${field('희망 지역','on-region',S.profile.region)}<div class="span2">${field('주요 기술','on-skills',S.profile.skills)}</div><div class="span2">${field('제외 · 확인할 조건','on-exclusions',S.profile.exclusions)}</div></div>`;
if(n===2)content=`<h2>나를 설명하는 자료를 연결해요</h2><p class="fine mt-8">링크 등록과 실제 원문 분석은 구분됩니다. 나중에 추가해도 됩니다.</p><div class="mt-24">${field('포트폴리오','on-portfolio',S.profile.portfolio,'url')}${field('GitHub','on-github',S.profile.github,'url')}${field('기술 블로그','on-blog',S.profile.blog,'url')}</div><div class="mt-20">${notice('이 단계는 링크를 저장하는 시연입니다. URL을 방문하거나 내용을 읽지 않습니다.','', 'link')}</div>`;
if(n===3)content=`<h2>AI 실행과 알림은 PC를 통해</h2><p class="fine mt-8">실제 연결이 아니라 연결 구조를 확인하는 단계입니다.</p><div class="setting-row"><span class="connection-mark">GPT</span><div class="grow"><h3>자소서 · 전형 전략</h3><p>GPT-6 Astra / Medium · 사용자가 지정한 설정값</p></div>${tag('예시','green')}</div><div class="setting-row"><span class="connection-mark">G</span><div class="grow"><h3>공고 · 자료 검색</h3><p>Gemini CLI 실행 · 실제 검색 없음</p></div>${tag('예시','green')}</div><div class="setting-row"><span class="connection-mark">#</span><div class="grow"><h3>Slack / job-alerts</h3><p>비밀 Webhook URL은 이 시안에 입력하지 않습니다.</p></div>${tag('미리보기','blue')}</div><div class="mt-20">${notice('00시에 PC가 꺼져 있었다면, 다음 연결 때 오늘의 성공 기록을 확인하고 한 번 갱신하는 설계입니다.','', 'clock')}</div>`;
if(n===4)content=`<h2>준비할 조건이 정리됐어요</h2><p class="fine mt-8">언제든 마이데이터와 설정에서 수정할 수 있습니다.</p><div class="key-value mt-20"><span>경력 조건</span><span>${esc(S.profile.career)}</span></div><div class="key-value"><span>희망 지역</span><span>${esc(S.profile.region)}</span></div><div class="key-value"><span>알림 채널</span><span>Slack · job-alerts</span></div><div class="key-value"><span>갱신 기준</span><span>매일 00시 / 미실행 시 다음 연결</span></div><div class="key-value"><span>데이터 저장</span><span>프로토타입은 브라우저에만 저장</span></div><div class="mt-20">${notice('이제 공고를 선택하고 자소서와 전형 준비 흐름을 확인할 수 있습니다. 가상의 회사와 예시 답변만 사용합니다.','green','checkCircle')}</div>`;
return `<div class="onboarding"><div class="row between"><div class="row"><span class="brandmark"><i></i><i></i><i></i><i></i></span><strong style="font-size:21px">준비실</strong></div>${btn('화면 목록','screen-map',{cls:'small',icon:'grid'})}</div><div class="stepper">${['지원 조건','기본 자료','연결 방식','시작하기'].map((x,i)=>`<div class="stepper-item ${i+1<=n?'active':''}"><span>${i+1<n?icon('check','sm'):i+1}</span>${x}</div>`).join('')}</div><section class="panel"><div class="panel-body" style="padding:28px">${content}</div></section><div class="onboarding-actions"><div>${n>1?btn('이전','onboard-prev',{icon:'back'}):goButton('나중에 설정','home','ghost')}</div>${btn(n===4?'준비실 시작하기':'다음','onboard-next',{cls:'primary',icon:'arrow'})}</div><p class="fine mt-20" style="font-size:11px">실제 계정은 생성되지 않습니다. 예시 조건과 화면 이동을 확인하는 프로토타입입니다.</p></div>`}
function notFound(){return empty('해당 예시 화면을 찾을 수 없습니다.','화면 목록에서 확인할 페이지를 선택해 주세요.',btn('전체 화면 목록','screen-map',{cls:'primary',icon:'grid'}),'search')}
function render(){const [r,id,sub]=route();const app=document.getElementById('app');document.title='준비실 · '+currentMeta().name+' — 클릭형 프로토타입';if(r==='login'||r==='signup'){app.innerHTML=authPage(r==='signup');return}if(r==='onboarding'){app.innerHTML=onboardingPage();return}let content;switch(r){case'home':content=homePage();break;case'jobs':content=jobsPage();break;case'job':content=jobPage(id);break;case'applications':content=applicationsPage();break;case'workspace':content=workspacePage(id,sub==='research');break;case'write':content=writerPage(id);break;case'submission':content=submissionPage(id);break;case'prep':content=prepPage(id);break;case'data':content=dataPage();break;case'experiences':content=experiencesPage();break;case'calendar':content=calendarPage();break;case'settings':content=settingsPage();break;default:content=notFound()}app.innerHTML=shell(content)}
function showMap(){openModal('전체 화면 둘러보기',`<p class="fine mb-16">15개 사용자 화면을 모두 이동할 수 있습니다. 상세 화면의 탭과 팝업도 함께 눌러보세요.</p><div class="screen-map">${PAGE_MAP.map(p=>`<button data-action="go" data-val="${p.route}" class="${currentMeta().id===p.id?'current':''}">${icon(p.icon)}<div><small>${p.id}</small><strong>${p.name}</strong><span class="fine" style="font-size:10px">${p.desc}</span></div></button>`).join('')}</div><div class="mt-20">${notice('<strong>추천 검토 흐름</strong><br>공고 찾기 → 공고 상세 → 지원 준비실 → 자기소개서 → 제출 기록 → 전형 준비 → 일정','', 'arrow')}</div>`,btn('색상 · 배치 기준','design-guide',{icon:'palette',cls:'small'})+btn('닫기','close-modal',{cls:'small'}),true,'화면 수와 메뉴 구성은 이 시안을 보며 조정할 수 있습니다.')}
function showDesign(){const colors=[['전체 배경','#111517','검정에 가까운 차콜'],['내비게이션','#151A1D','배경보다 한 단계 밝게'],['작업 영역','#191F23','표·편집·자료 패널'],['기본 글자','#EEF2F3','짙은 배경 위 주 정보'],['보조 글자','#98A5AC','날짜·출처·도움말'],['주요 행동','#8AE0BF','채도가 낮은 민트'],['기한 주의','#E7C085','라벨과 글자를 함께'],['전형 정보','#A8C5ED','일정과 제출 상태']];openModal('다크모드 디자인 기준',`<div class="row between wrap mb-16"><div><h3>차콜 + 소프트 민트</h3><p class="fine mt-8">장식보다 읽기, 비교, 글쓰기에 집중합니다.</p></div>${tag('디자인 검토안','green')}</div><div class="token-grid">${colors.map(([n,c,d])=>`<div class="token-item"><div class="swatch" style="background:${c}"></div><strong>${n}</strong><div>${c}</div><div class="fine" style="font-size:10px">${d}</div></div>`).join('')}</div><hr><div class="cols-half"><div><h3>레이아웃 · 글자</h3><p class="fine mt-12" style="line-height:2">데스크톱: 고정 왼쪽 메뉴 + 넓은 작업 영역<br>공고는 비교 가능한 표, 자소서는 큰 편집기<br>한국어 시스템 글꼴 · 본문 14px, 편집 15px<br>좁은 화면: 하단 메뉴와 1열 작업 영역<br>원본 자료와 지원별 작업본은 별도 화면</p></div><div><h3>움직임 · 예외 상태</h3><p class="fine mt-12" style="line-height:2">버튼 상태 120ms, 팝업은 즉시 표시<br>페이지 진입 애니메이션과 강제 타이핑 없음<br>움직임 감소 설정 존중<br>빈 검색, 연결 끊김, 기한 미상, 배치 실패 포함<br>미리보기는 외부 서비스에 아무 요청도 보내지 않음</p></div></div>`,btn('수정 의견 남기기','feedback',{cls:'primary',icon:'message'})+btn('닫기','close-modal'),true)}
function showFeedback(){openModal('시안을 보며 남기는 의견',`<div class="form-grid">${selectField('어느 화면인가요?','fb-page',PAGE_MAP.map(p=>[p.id,p.id+' '+p.name]),currentMeta().id)}${selectField('어떤 부분인가요?','fb-type',[['layout','화면 배치'],['color','색감 · 글자'],['flow','동작 · 이동'],['scope','기능 범위'],['other','기타']],'layout')}<div class="span2">${textareaField('바꾸고 싶은 점','fb-text','','예: 공고 목록의 회사명보다 직무명을 더 크게 보여주세요.',4)}</div></div><div class="row between wrap mb-16">${btn('의견 추가','save-feedback',{cls:'primary',icon:'plus'})}<span class="fine">${S.feedback.length}개 의견 · 이 브라우저에 저장</span></div><hr><h3>모아둔 의견</h3><div id="feedback-list">${S.feedback.length?S.feedback.map(f=>`<article class="feedback-item"><div class="row between"><span class="fine">${esc(f.page)} · ${esc({layout:'화면 배치',color:'색감 · 글자',flow:'동작 · 이동',scope:'기능 범위',other:'기타'}[f.type])}</span>${btn('','delete-feedback',{id:f.id,cls:'ghost icon-only',icon:'trash',title:'검토 의견 삭제'})}</div><p>${esc(f.text)}</p></article>`).join(''):'<p class="fine mt-12">아직 남긴 의견이 없습니다.</p>'}</div>`,btn('의견 파일로 내보내기','export-feedback',{icon:'download'})+btn('닫기','close-modal'),true,'의견 파일을 다음 대화에 첨부하면 화면별 수정 목록으로 사용할 수 있습니다.')}

function showEvent(id){const e=currentEvents().find(x=>x.id===id);if(!e)return toast('해당 예시 일정을 찾을 수 없습니다.',true);UI.currentEvent=e;let footer=e.appId?goButton('지원 준비실','workspace/'+e.appId,'small','arrow'):'';footer+=(e.type==='deadline'?btn('기재된 기한 수정','edit-deadline',{id:getApp(e.appId).jobId,cls:'small'}):btn('일정 수정','edit-event',{id:e.id,cls:'small',icon:'edit'}));if(!e.derived)footer+=btn('삭제','delete-event',{id:e.id,cls:'danger small',icon:'trash'});footer+=btn('닫기','close-modal',{cls:'small'});openModal('일정 확인',`${tag(eventLabel(e.type),e.type==='deadline'?'amber':'blue')}<h3 class="mt-16">${esc(e.title)}</h3><div class="key-value mt-16"><span>날짜</span><span>${dateFull(e.date)}</span></div><div class="key-value"><span>시간</span><span>${esc(e.time||'미정 · 임의로 정하지 않음')}</span></div><div class="meta-box mt-16">${esc(e.note||'추가 안내가 없습니다.')}</div>${e.type==='deadline'?'<p class="fine mt-12">기재된 마감일에 따른 상태입니다. 실제 원문 변경 여부를 확인한 것은 아닙니다.</p>':''}`,footer)}

function isSafeURL(v){if(!v)return true;try{const u=new URL(v);return ['http:','https:'].includes(u.protocol)}catch{return false}}
function generatedText(q){if(q.title.includes('지원'))return '지원 동기를 작성하기 전에 회사의 실제 제품과 해당 직무의 업무를 확인하고, 제 경험 중 어떤 부분을 연결할 수 있는지 살펴보려 합니다. 기존 시스템을 분석했던 경험에서는 화면과 서비스 로직, SQL의 흐름을 함께 이해하는 것이 중요했습니다. 개인 프로젝트에서는 구현 속도뿐 아니라 실패 상황과 재처리 조건을 먼저 정리하는 방식을 연습했습니다.\n\n이 시안의 회사 정보는 가상이므로, 실제 지원 동기를 완성된 사실처럼 만들지 않습니다. 실제 공고와 공식 자료를 확인한 뒤 제가 기여할 수 있는 범위를 구체적으로 작성해야 합니다. 이 문장은 예시 생성과 적용 과정을 확인하기 위한 고정된 답변입니다.';if(q.title.includes('협업'))return '협업 경험을 작성할 때는 먼저 실제로 함께 일했던 상황과 서로 달랐던 의견을 확인해야 합니다. 그다음 제가 어떤 근거를 제시했고 상대방의 의견을 어떻게 이해했는지, 최종 결정에 어떤 방식으로 기여했는지를 정리합니다.\n\n이 프로토타입에는 특정 협업 사건의 근거가 입력되어 있지 않습니다. 따라서 있었던 일처럼 갈등이나 성과를 만들어 쓰지 않고, 경험을 확인할 질문을 남기는 예시로 구성했습니다. 실제 작성에서는 상황, 본인의 행동, 결과와 배운 점을 사용자가 확인한 경험으로 바꾸어야 합니다.';return REVISED}
function generateDraft(id,qid){const a=getApp(id),q=a.questions.find(x=>x.id===(qid||getQuestion(a).id));if(!S.settings.runner){if(!UI.queued.some(t=>t.type==='draft'&&t.appId===id&&t.qid===q.id))UI.queued.push({type:'draft',appId:id,qid:q.id});toast('개인 실행기 연결이 끊긴 예시 상태입니다. 요청을 대기열에 두었습니다.',true);render();return}if(UI.generating)return;UI.generating=true;render();setTimeout(()=>{UI.generating=false;if(!S.settings.runner){toast('생성 중 연결이 끊겼습니다. 기존 초안은 보존됩니다.',true);render();return}UI.pendingGenerated={appId:id,qid:q.id,text:generatedText(q),base:q.text};render();openModal('현재 초안과 예시 결과 비교',`${notice('미리 준비한 예시 문장을 불러왔습니다. 실제 AI가 선택한 경험을 분석하거나 답변을 생성한 결과가 아닙니다.','blue','info')}<div class="compare-cols mt-20"><div><h3>현재 초안</h3><p class="fine mt-8">생성 중에 수정한 내용도 현재 초안에 남습니다.</p><div class="compare-text mt-12">${esc(q.text||'아직 작성한 내용이 없습니다.')}</div></div><div><h3>예시 생성 결과</h3><p class="fine mt-8">적용 전에는 기존 글을 바꾸지 않습니다.</p><div class="compare-text mt-12">${esc(UI.pendingGenerated.text)}</div></div></div>`,btn('기존 글 유지','close-modal')+btn('예시 결과 적용','apply-generated',{cls:'primary',icon:'check'}),true)},900)}
function runBatch(){if(UI.batchRunning){toast('이미 갱신 흐름을 시연하고 있습니다.');return}if(!S.settings.runner){if(!UI.queued.some(t=>t.type==='batch'))UI.queued.push({type:'batch'});toast('개인 실행기가 연결되면 미실행 배치를 확인하는 흐름입니다.',true);render();return}if(S.settings.batchDone){toast('오늘 성공 기록이 있는 예시 상태입니다. 중복 갱신하지 않습니다.');return}UI.batchRunning=true;S.settings.batchFailed=false;render();setTimeout(()=>{UI.batchRunning=false;if(!S.settings.runner){S.settings.batchFailed=true;save();render();toast('연결이 끊겨 갱신을 완료하지 못한 상태로 남겼습니다.',true);return}let added=0;[{...clone(JOBS[0]),id:'j13',company:'브릭데이터',mark:'d',title:'데이터 서비스 백엔드 개발자',posted:TODAY,deadline:'2026-09-27',new:true},{...clone(JOBS[3]),id:'j14',company:'모먼트플로우',mark:'M',title:'Spring 백엔드 주니어',posted:TODAY,new:true}].forEach(j=>{if(!getJob(j.id)){S.jobs.unshift(j);added++}});S.settings.batchDone=true;S.settings.lastSuccess='2026.09.16 00:08 · 시연';UI.queued=UI.queued.filter(t=>t.type!=='batch');save();render();toast(`갱신 시연 완료: 예시 공고 ${added}건 추가. 실제 검색이나 Slack 발송은 하지 않았습니다.`)},1100)}
function reconnect(){S.settings.runner=true;save();render();toast('PC 재연결 흐름을 시연합니다. 오늘의 성공 기록을 확인합니다.');if(!S.settings.batchDone)runBatch();const queued=UI.queued.find(t=>t.type==='draft');if(queued){UI.queued=UI.queued.filter(t=>t!==queued);setTimeout(()=>{UI.questionId=queued.qid;goto('write/'+queued.appId);setTimeout(()=>generateDraft(queued.appId,queued.qid),90)},1500)}}
function updateCounter(a,q){const n=countText(q),el=document.getElementById('char-count'),status=document.getElementById('char-status');if(el){el.textContent=n;el.className='char-count '+(n>=q.min&&n<=q.max?'good':'bad')}if(status){status.textContent=n<q.min?'최소 분량 미달':n>q.max?'최대 분량 초과':'분량 충족';status.className='tag '+(n>=q.min&&n<=q.max?'green':'amber')}const nav=document.querySelector('.question-nav [data-id="'+q.id+'"] .q-foot');if(nav)nav.textContent=n+(q.unit==='bytes'?' bytes':'자');const saved=document.getElementById('save-state');if(saved)saved.innerHTML=icon('check','sm')+' 브라우저 저장'}

 'study':b=>{const q=currentQuestionQA(b.dataset.id);if(!q)return;UI.studyQuestion=q;const old=S.notes.find(n=>n.studyKey===q.study);openModal('모르는 부분을 학습 기록으로',`<h3>${esc(q.study)}</h3><div class="meta-box mt-12">연결된 준비 질문<br>${esc(q.title)}</div><div class="mt-20">${textareaField('내가 이해한 내용과 더 확인할 부분','study-note',old?.content||'','이 시안은 학습자료를 검색하거나 설명을 자동 생성하지 않습니다.',6)}</div><label class="check-row"><input type="checkbox" id="study-common" checked><span>다른 지원에서도 재사용할 공통 마이데이터로 저장</span></label>`,btn('닫기','close-modal')+btn('학습 메모 저장','save-study',{cls:'primary',icon:'book'}))},
 'save-study':()=>{const q=UI.studyQuestion,text=formValue('study-note');if(!text)return toast('학습 메모를 입력해 주세요.',true);const old=S.notes.find(n=>n.studyKey===q.study);if(old){old.content=text;old.appId=checked('study-common')?'':activeApp().id}else S.notes.push({id:uid('note'),title:q.study,type:'memo',content:text,url:'',appId:checked('study-common')?'':activeApp().id,studyKey:q.study});save();closeModal();render();toast('학습 메모를 저장했습니다.')},
 'save-review':b=>{getApp(b.dataset.id).review=formValue('prep-review');save();toast('이 지원의 전형 회고를 저장했습니다.')},
 'paste-invitation':b=>{UI.invitationApp=b.dataset.id;openModal('받은 전형 안내 붙여넣기',`${textareaField('안내 내용','invitation-text','','실제 이메일 접근 없이 직접 붙여 넣는 흐름입니다.',6)}<div class="row wrap">${btn('예시 안내 넣기','fill-invitation',{cls:'small',icon:'file'})}<span class="fine">날짜 후보를 확인한 뒤 직접 저장합니다.</span></div>`,btn('취소','close-modal')+btn('일정 확인으로','parse-invitation',{cls:'primary',icon:'arrow'}))},
 'fill-invitation':()=>{document.getElementById('invitation-text').value='안녕하세요. 2026-09-17 18:00까지 가능한 면접 시간을 회신해 주세요. 면접 일정은 회신 후 확정됩니다.\n\n※ 실제 안내가 아닌 예시입니다.'},
 'parse-invitation':()=>{const text=formValue('invitation-text');if(!text)return toast('안내 내용이나 예시를 입력해 주세요.',true);const d=text.match(/\b(20\d{2}-\d{2}-\d{2})\b/),t=text.match(/\b([0-2]\d:[0-5]\d)\b/);eventModal({title:getJob(getApp(UI.invitationApp).jobId).company+' · 안내 확인',date:d?d[1]:'',time:t?t[1]:'',type:text.includes('회신')?'reply':'stage',appId:UI.invitationApp,note:text});toast('단순 날짜 후보만 옮겼습니다. 실제 의미와 회신 기한을 확인한 뒤 저장하세요.')},
 'profile-tab':b=>{UI.profileTab=b.dataset.val;render()},
 'save-profile':()=>{for(const id of ['profile-portfolio','profile-github','profile-blog'])if(!isSafeURL(formValue(id)))return toast('링크 형식을 확인해 주세요.',true);const p=S.profile;p.name=formValue('profile-name')||'지원자';p.role=formValue('profile-role');p.summary=formValue('profile-summary');p.skills=formValue('profile-skills');p.portfolio=formValue('profile-portfolio');p.github=formValue('profile-github');p.blog=formValue('profile-blog');p.career=formValue('profile-career');p.region=formValue('profile-region');p.exclusions=formValue('profile-exclusions');save();render();toast('기본 프로필을 저장했습니다. 기존 지원별 자료와 제출본은 바뀌지 않습니다.')},
 'add-source':()=>addSourceModal(),
 'save-source':()=>{const url=formValue('source-url'),file=document.getElementById('source-file')?.files[0],title=formValue('source-title')||file?.name||'';if(!title)return toast('자료 이름 또는 파일을 선택해 주세요.',true);if(!isSafeURL(url))return toast('올바른 링크를 입력해 주세요.',true);S.sources.push({id:uid('source'),title,type:formValue('source-type'),url,status:file?'파일명만 등록':url?'링크만 등록':'이름만 등록',note:file?'선택한 파일명: '+file.name+' / 실제 파일 내용은 저장하거나 분석하지 않았습니다.':'사용자가 등록한 예시 자료입니다. 원문을 읽거나 분석하지 않았습니다.'});save();closeModal();render();toast('입력한 자료 이름과 링크를 저장했습니다. 내용은 전송하지 않았습니다.')},
 'source-info':b=>{const s=S.sources.find(x=>x.id===b.dataset.id);openModal('등록한 원본 자료',`<h3>${esc(s.title)}</h3><div class="row mt-12">${tag(s.status,'blue')}</div><p class="detail-copy mt-16">${esc(s.note)}</p>${s.url?`<div class="meta-box mt-16" style="overflow-wrap:anywhere">${esc(s.url)}</div>`:''}`,btn('닫기','close-modal'))},
 'delete-source':b=>confirmDelete('등록한 자료 삭제','이 브라우저에 저장한 자료 등록 정보를 삭제합니다. 실제 원본 파일은 삭제하지 않습니다.','source',b.dataset.id),
 'add-note':b=>showNote(b.dataset.id||''),
 'save-note':()=>{const title=formValue('note-title'),content=formValue('note-content'),url=formValue('note-url');if(!title||!content)return toast('자료 제목과 내용을 입력해 주세요.',true);if(!isSafeURL(url))return toast('출처 링크 형식을 확인해 주세요.',true);S.notes.push({id:uid('note'),title,content,url,type:formValue('note-type'),appId:formValue('note-app')});save();closeModal();render();toast('자료의 유형과 출처를 구분해 저장했습니다.')},
 'delete-note':b=>confirmDelete('메모 삭제','이 브라우저에 저장한 메모를 삭제합니다.','note',b.dataset.id),
 'note-link':b=>{const n=S.notes.find(x=>x.id===b.dataset.id);UI.sourceURL=n.url;openModal('저장한 출처 링크',`<div class="meta-box" style="overflow-wrap:anywhere">${esc(n.url)}</div><p class="fine mt-16">저장한 링크만 표시합니다. 이 시안에서 원문을 읽거나 외부 사이트로 접속하지 않습니다.</p>`,btn('주소 복사','copy-source',{icon:'copy'})+btn('닫기','close-modal'))},
 'edit-experience':b=>showExperience(b.dataset.id),
 'save-experience':b=>{const title=formValue('exp-title');if(!title)return toast('경험 제목을 입력해 주세요.',true);const data={title,kind:formValue('exp-kind'),role:formValue('exp-role'),body:formValue('exp-body'),skills:formValue('exp-skills').replaceAll(',',' · '),confirmed:checked('exp-confirm')};const e=S.experiences.find(x=>x.id===b.dataset.id);if(e)Object.assign(e,data);else S.experiences.push({id:uid('exp'),...data});save();closeModal();render();toast('경험의 수행 범위와 확인 상태를 저장했습니다.')},
 'confirm-experience':b=>{const e=S.experiences.find(x=>x.id===b.dataset.id);e.confirmed=!e.confirmed;save();render();toast('경험 확인 상태를 변경했습니다. 실제 검증을 수행한 것은 아닙니다.')},
 'select-date':b=>{UI.selectedDate=b.dataset.val;render()},
 'calendar-filter':b=>{UI.calFilter=b.dataset.val;render()},
 'calendar-prev':()=>{UI.calendarMonth--;if(UI.calendarMonth<0){UI.calendarMonth=11;UI.calendarYear--}UI.selectedDate=dateISO(UI.calendarYear,UI.calendarMonth,1);render()},
 'calendar-next':()=>{UI.calendarMonth++;if(UI.calendarMonth>11){UI.calendarMonth=0;UI.calendarYear++}UI.selectedDate=dateISO(UI.calendarYear,UI.calendarMonth,1);render()},
 'calendar-today':()=>{UI.calendarYear=2026;UI.calendarMonth=8;UI.selectedDate=TODAY;render()},
 'add-event':b=>eventModal({date:b.dataset.val||UI.selectedDate}),
 'event-detail':b=>showEvent(b.dataset.id),
 'edit-event':b=>{const e=currentEvents().find(e=>e.id===b.dataset.id);if(e)eventModal(e)},
 'save-event':()=>{const title=formValue('event-title'),date=formValue('event-date');if(!title||!date)return toast('일정 이름과 날짜를 입력해 주세요.',true);const e={title,date,time:formValue('event-time'),type:formValue('event-type'),appId:formValue('event-app'),note:formValue('event-note')};const old=UI.editEvent;if(old?.stageId){const a=getApp(old.appId),st=a.stages.find(s=>s.id===old.stageId);st.date=e.date;st.time=e.time;st.note=e.note;st.name=e.title.includes(' · ')?e.title.split(' · ').slice(1).join(' · '):e.title}else if(old?.id?.startsWith('goal-')){getApp(old.appId).goal=e.date}else if(old?.id){const i=S.events.findIndex(x=>x.id===old.id);if(i>=0)S.events[i]={...e,id:old.id};else S.events.push({...e,id:uid('event')})}else S.events.push({...e,id:uid('event')});UI.selectedDate=date;UI.calendarYear=Number(date.slice(0,4));UI.calendarMonth=Number(date.slice(5,7))-1;save();closeModal();render();toast('예시 일정을 저장했습니다. 실제 외부 알림은 예약되지 않습니다.')},
 'delete-event':b=>confirmDelete('일정 삭제','직접 등록한 예시 일정을 삭제합니다.','event',b.dataset.id),
 'edit-deadline':b=>{const j=getJob(b.dataset.id);openModal('저장된 공고 기한 수정',`${notice('원문에서 확인한 기한을 수정하는 화면입니다. 회사의 실제 마감 상태를 자동 조회하지 않습니다.','', 'clock')}<div class="mt-20">${selectField('기한 유형','deadline-type',[['fixed','마감일 있음'],['rolling','상시채용'],['unknown','기한 미확인']],j.closeType)}${field('마감 날짜','deadline-date',j.deadline||'','date')}${field('확인한 시간 (선택)','deadline-time',j.time||'','time')}</div>`,btn('취소','close-modal')+btn('기한 저장','save-deadline',{id:j.id,cls:'primary'}))},
 'save-deadline':b=>{const j=getJob(b.dataset.id),t=formValue('deadline-type'),d=formValue('deadline-date');if(t==='fixed'&&!d)return toast('기간형 공고의 날짜를 입력해 주세요.',true);j.closeType=t;j.deadline=t==='fixed'?d:null;j.time=t==='fixed'?formValue('deadline-time'):'';save();closeModal();render();toast('저장된 기한을 수정했습니다. 날짜 기준 상태와 일정에 반영됩니다.')},
 'settings-tab':b=>{UI.settingsTab=b.dataset.val;render()},
 'switch':b=>{const k=b.dataset.key;S.settings[k]=!S.settings[k];save();render();if(k==='runner'){if(S.settings.runner)toast('연결된 예시 상태입니다. ‘PC 재연결 시연’으로 미실행 작업을 확인할 수 있습니다.');else toast('연결 끊김을 시연합니다. 새 AI 요청은 대기하고 기존 자료는 보입니다.',true)}else toast('시안의 알림 설정을 저장했습니다. 실제 외부 연결은 없습니다.')},
 'slack-preview':()=>openModal('Slack 메시지 미리보기',`${!S.settings.slack?notice('현재 Slack 알림은 꺼진 예시 상태입니다. 아래는 메시지 형태만 보여줍니다.','amber','bell'):''}<div class="mt-12">${slackMessage()}</div><p class="fine mt-16">비밀 Webhook 주소를 사용하지 않으며 Slack에 전송하지 않습니다.</p>`,btn('닫기','close-modal')),
 'batch-scenario':b=>{S.settings.batchDone=b.dataset.val==='done';S.settings.batchFailed=b.dataset.val==='failed';S.settings.lastSuccess=S.settings.batchDone?'2026.09.16 00:08 · 시연':'2026.09.15 00:08 · 시연';save();render();toast('배치 상태를 변경했습니다. 실제 예약 실행은 하지 않습니다.')},
 'run-batch':()=>runBatch(),
 'reconnect':()=>reconnect(),
 'export-data':()=>{download('준비실_시안데이터.json',JSON.stringify(S,null,2),'application/json;charset=utf-8');toast('브라우저에 저장된 시안 데이터를 내보냈습니다.')},
 'reset-demo':()=>openModal('시안 데이터를 초기화할까요?','<p class="detail-copy">이 프로토타입에 입력한 초안, 일정, 프로필, 검토 의견을 지우고 최초 예시 상태로 돌아갑니다. 필요한 내용은 먼저 내보내세요.</p>',btn('취소','close-modal')+btn('초기화','reset-confirmed',{cls:'danger',icon:'refresh'})),
 'reset-confirmed':()=>{S=seed();UI.jobsSearch='';UI.appSearch='';UI.questionId='q1';UI.openQA='qa1';UI.generating=false;UI.batchRunning=false;UI.queued=[];save();goto('home');toast('처음의 예시 데이터로 돌아왔습니다.')},
 'delete-confirmed':b=>{if(b.dataset.val==='source')S.sources=S.sources.filter(x=>x.id!==b.dataset.id);if(b.dataset.val==='note')S.notes=S.notes.filter(x=>x.id!==b.dataset.id);if(b.dataset.val==='event')S.events=S.events.filter(x=>x.id!==b.dataset.id);save();closeModal();render();toast('시안에서 삭제했습니다.')},
 'demo-login':()=>{goto('home');toast('예시 계정으로 진입했습니다. 실제 인증이나 비밀번호 저장은 하지 않습니다.')},
 'demo-signup':()=>{S.onboardStep=1;save();goto('onboarding');toast('가입 화면 시연입니다. 입력한 비밀번호는 저장하지 않습니다.')},
 'onboard-prev':()=>{S.onboardStep=Math.max(1,S.onboardStep-1);save();render()},
 'onboard-next':()=>{const n=S.onboardStep;if(n===1){S.profile.career=formValue('on-career');S.profile.region=formValue('on-region');S.profile.skills=formValue('on-skills');S.profile.exclusions=formValue('on-exclusions')}if(n===2){for(const id of ['on-portfolio','on-github','on-blog'])if(!isSafeURL(formValue(id)))return toast('링크 형식을 확인해 주세요.',true);S.profile.portfolio=formValue('on-portfolio');S.profile.github=formValue('on-github');S.profile.blog=formValue('on-blog')}if(n===4){S.onboardComplete=true;save();goto('home');toast('최초 설정 흐름을 마쳤습니다. 실제 연결은 생성하지 않았습니다.')}else{S.onboardStep++;save();render()}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;if(b.dataset.action==='backdrop'&&e.target!==b)return;e.preventDefault();const action=actions[b.dataset.action];if(action){try{const res=action(b,e);if(res?.catch)res.catch(err=>{console.error(err);toast('이 동작을 완료하지 못했습니다. 다시 시도해 주세요.',true)})}catch(err){console.error(err);toast('시안 동작 중 오류가 발생했습니다. 화면과 동작을 검토 의견에 남겨주세요.',true)}}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='jobs-search'){UI.jobsSearch=t.value;const box=document.getElementById('job-results');if(box)box.innerHTML=jobsResult()}if(t.id==='app-search'){UI.appSearch=t.value;const box=document.getElementById('application-results');if(box)box.innerHTML=appCards()}if(t.id==='draft-editor'){const a=getApp(t.dataset.app),q=a.questions.find(q=>q.id===t.dataset.q);q.text=t.value;save();updateCounter(a,q)}if(t.dataset.answer){const a=getApp(t.dataset.app),qa=stageQuestions(a,currentStage(a)).find(x=>x.id===t.dataset.answer);qa.answer=t.value;save()}if(t.id==='prep-review'){activeApp().review=t.value;save()}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='jobs-exp'){UI.jobsExp=t.value;render()}if(t.id==='jobs-deadline'){UI.jobsDeadline=t.value;render()}if(t.id==='submit-confirm'){const b=document.getElementById('record-submit-btn');if(b)b.disabled=!t.checked}if(t.id==='source-file'){const x=document.getElementById('source-file-name');if(x)x.textContent=t.files?.[0]?'선택한 파일명: '+t.files[0].name:'파일 내용은 업로드하지 않습니다.'}if(t.id==='notify-time'){S.settings.notify=t.value;save();toast('알림 수신 시점의 검토 설정을 저장했습니다.')}const type=t.dataset.change;if(type==='todo'){getApp(t.dataset.id).todo[t.dataset.key]=t.checked;save();t.closest('.check-row').classList.toggle('done',t.checked)}if(type==='evidence'){const a=getApp(t.dataset.id);a.evidence=a.evidence||{};a.evidence[t.dataset.key]=t.checked;save()}if(type==='app-status'){const a=getApp(t.dataset.id);if(t.value==='submitted'&&!a.snapshots.length){t.value=a.status;showSubmit(a.id);return}a.status=t.value;save();render();toast('내부 지원 상태를 수정했습니다. 실제 회사의 제출·철회·결과는 바뀌지 않습니다.')}if(type==='stage-status'){const a=getApp(t.dataset.app);a.stages.find(st=>st.id===t.dataset.id).state=t.value;save();render()}if(type==='qa-level'){const a=getApp(t.dataset.app);stageQuestions(a,currentStage(a)).find(q=>q.id===t.dataset.id).level=t.value;save();render()}if(type==='notify-day'){const n=Number(t.value);S.settings.days=t.checked?[...new Set([...S.settings.days,n])]:S.settings.days.filter(x=>x!==n);save()}});
document.addEventListener('keydown',e=>{const modal=document.querySelector('.modal');if(e.key==='Escape'&&modal){e.preventDefault();closeModal();return}if(e.key==='Tab'&&modal){const focusable=[...modal.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href],[tabindex="0"]')].filter(el=>el.offsetParent!==null);const first=focusable[0],last=focusable[focusable.length-1];if(!first)return;if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.addEventListener('hashchange',()=>{closeModal();render();window.scrollTo(0,0)});
if(!location.hash)history.replaceState(null,'','#home');
render();
</script>

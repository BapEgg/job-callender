name: job-callender-test
services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: testuser
      POSTGRES_DB: testdb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - test-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 2s
      timeout: 3s
      retries: 20
  web:
    image: job-callender-web
    environment:
      DATABASE_URL: postgres://testuser:${POSTGRES_PASSWORD}@db:5432/testdb
      HOST: 0.0.0.0
      PORT: 3000
      APP_ORIGIN: http://127.0.0.1:3001
      ALLOW_TEST_USERS: 'true'
      RUNNER_TOKEN: ${RUNNER_TOKEN}
      FILES_DIR: /data/files
    ports:
      - '127.0.0.1:3001:3000'
    volumes:
      - test-attachments:/data/files
    depends_on:
      db:
        condition: service_healthy
volumes:
  test-postgres:
  test-attachments:

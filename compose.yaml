name: job-callender
services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: jobprep
      POSTGRES_DB: jobprep
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup-local.mjs first}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobprep -d jobprep"]
      interval: 5s
      timeout: 3s
      retries: 15
  web:
    build: .
    environment:
      DATABASE_URL: postgres://jobprep:${POSTGRES_PASSWORD}@db:5432/jobprep
      HOST: 0.0.0.0
      PORT: 3000
      APP_ORIGIN: http://localhost:3000
      RUNNER_TOKEN: ${RUNNER_TOKEN}
      FILES_DIR: /data/files
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - attachments:/data/files
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
  attachments:
